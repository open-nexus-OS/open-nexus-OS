[package]
name = "nx"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt", "time", "macros"] }
configd = { path = "../../source/services/configd" }
crash = { path = "../../userspace/crash" }
nxcd = { path = "../../userspace/crash/nxcd", features = ["zst"] }
nxsym = { path = "../nxsym" }
nexus-config = { path = "../../userspace/config" }
nexus_policy = { package = "policy", path = "../../userspace/policy" }
statefs = { path = "../../userspace/statefs" }
storage = { path = "../../userspace/storage" }
logd = { path = "../../source/services/logd" }
bootctld = { path = "../../source/services/bootctld" }
nxra = { path = "../../userspace/nxra" }
ed25519-dalek = "2"
bootfmt = { path = "../../userspace/bootfmt" }
updates = { path = "../../userspace/updates" }
nxdelta = { path = "../../userspace/nxdelta" }
nxfs = { path = "../../userspace/nxfs" }
# TASK-0055D: dev display/profile preset resolver (`nx ui preset`) — the
# SystemUI manifest registry is the ONE authority; host build, no os-lite.
systemui = { path = "../../source/services/systemui" }
capnp = { version = "0.24", default-features = false, features = ["alloc", "unaligned"] }
tar = "0.4"
# TASK-0321: system-volume builder — bundle manifests (ADR-0020) + ELF
# launch params (same `object` logic as init-lite's build script).
bundlemgr = { path = "../../userspace/bundlemgr" }
# TASK-0321 P5: `nx app compile` — the ui-program payload compile that used
# to live in bundlemgrd's build.rs (byte-deterministic).
nexus-dsl-core = { path = "../../userspace/dsl/core" }
object = { version = "0.36", features = ["write"] }

[dev-dependencies]
nexus-idl-runtime = { path = "../../userspace/nexus-idl-runtime" }
tempfile = "3.23.0"
