#
# The disk this board boots from and what its boot chain holds (TASK-0260 P1/P2,
# RFC-0089 §2): `nx image build --target bpi-f3` builds the eMMC's user area byte for
# byte (sparse, the GPT's backup at its last sector) and, beside it, the eMMC's boot0
# hardware partition (`<out>.boot0`) — where the boot ROM reads the header and the SPL
# (the vendor's flash source, docs/board/measurements/2026-09-26-boot-medium). Paths are
# relative to this file; the vendor pieces are fetched and hash-checked by
# `scripts/fetch-board-inputs.sh` (pins: resources/board/bpi-f3/PROVENANCE.md).

[disk]
# The eMMC's user area, in 512-byte sectors (14.56 GiB; measured 2026-09-26,
# docs/board/measurements/2026-09-26-boot-medium/emmc-state.txt).
sectors = 30535680

[boot0]
# The eMMC's boot0 hardware partition: 4 MiB (BOOT_SIZE_MULT 32; U-Boot fastboot
# reports 0x400000 for it, measured 2026-09-26).
sectors = 8192
# The eMMC boot-ROM header at 0 (media tag `eMMC`); it places the SPL at 0x200.
header = "../../../resources/board/bpi-f3/vendor/factory/bootinfo_emmc.bin"
# The SPL (DDR training), at the header's offset.
spl = "../../../resources/board/bpi-f3/vendor/factory/FSBL.bin"

[head]
# OpenSBI (`fw_dynamic`, a FIT), into `opensbi` — the SPL loads it by that name.
# `uboot` holds the loader's FIT (`--fit`, TASK-0260B).
opensbi = "../../../resources/board/bpi-f3/vendor/fw_dynamic.itb"
