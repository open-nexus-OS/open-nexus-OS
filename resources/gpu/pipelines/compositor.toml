#
# The compositor's pipelines for the board GPU (TASK-0215 5c-2 P4c, P5, ADR-0072 §5–7): one entry
# per variant — a source, its entry point, its overrides, its blend — with its instruction-group
# budget. `nxgpu library` compiles each, holds it to its budget, generates its setup programs
# and builds `compositor.nxgp` (README.md); ids are the pipelines' names on the wire.
target = "board"

# A surface at full opacity in its own colours — the compositor's commonest draw, and a copy.
[[pipeline]]
id = 1
name = "layer-opaque"
source = "../shaders/layer.wgsl"
overrides = { tinted = false }
blend = "replace"
budget = 3

# A premultiplied texture (the GPU's own results) over what is below, tinted.
[[pipeline]]
id = 2
name = "layer-premultiplied"
source = "../shaders/layer.wgsl"
blend = "premultiplied"
budget = 11

# A client's surface (straight alpha) over what is below, at the layer's opacity.
[[pipeline]]
id = 3
name = "layer-straight"
source = "../shaders/layer.wgsl"
overrides = { straight = true }
blend = "premultiplied"
budget = 15

# A client's surface with its corners cut — the layer's four corner squares.
[[pipeline]]
id = 4
name = "layer-rounded"
source = "../shaders/layer.wgsl"
overrides = { straight = true, rounded = true }
blend = "premultiplied"
budget = 34

# A layer's drop shadow: the blurred rounded rectangle knocked out under the layer.
[[pipeline]]
id = 5
name = "shadow"
source = "../shaders/shadow.wgsl"
blend = "premultiplied"
budget = 43

# The glass layer's backdrop blur at radius 20 (windowd's glass), at half resolution: the
# horizontal pass reads the full-resolution backdrop, a tap every two pixels, each fetch averaging
# four texels (the downsample).
[[pipeline]]
id = 6
name = "blur-horizontal-20"
source = "../shaders/blur.wgsl"
entry = "horizontal"
overrides = { radius = 20 }
blend = "replace"
budget = 89

# The vertical pass over the horizontal one's result, two taps a fetch, the saturation lifted;
# the glass layer samples its result back with `layer-rounded`.
[[pipeline]]
id = 7
name = "blur-vertical-20"
source = "../shaders/blur.wgsl"
entry = "vertical"
overrides = { radius = 20 }
blend = "replace"
budget = 70

# The same chain at the other radii windowd's glass asks (TASK-0215 5c-3 P4b): 8 (a subtle
# glass), 30 (the default), 40 (panels and overlays). The wider ones carry more weights than the
# constant block's runs hold — those taps take a group a lane, the weights one register each.
[[pipeline]]
id = 8
name = "blur-horizontal-8"
source = "../shaders/blur.wgsl"
entry = "horizontal"
overrides = { radius = 8 }
blend = "replace"
budget = 41

[[pipeline]]
id = 9
name = "blur-vertical-8"
source = "../shaders/blur.wgsl"
entry = "vertical"
overrides = { radius = 8 }
blend = "replace"
budget = 40

[[pipeline]]
id = 10
name = "blur-horizontal-30"
source = "../shaders/blur.wgsl"
entry = "horizontal"
overrides = { radius = 30 }
blend = "replace"
budget = 129

[[pipeline]]
id = 11
name = "blur-vertical-30"
source = "../shaders/blur.wgsl"
entry = "vertical"
overrides = { radius = 30 }
blend = "replace"
budget = 100

[[pipeline]]
id = 12
name = "blur-horizontal-40"
source = "../shaders/blur.wgsl"
entry = "horizontal"
overrides = { radius = 40 }
blend = "replace"
budget = 169

[[pipeline]]
id = 13
name = "blur-vertical-40"
source = "../shaders/blur.wgsl"
entry = "vertical"
overrides = { radius = 40 }
blend = "replace"
budget = 120
