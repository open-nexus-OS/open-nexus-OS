[theme]
name = "highcontrast"
version = 2

# High contrast has no design contract; it maps every theme-varying role onto black and white
# with strong edges, opaque surfaces and no blur, so nothing inherits a light value on black
# (RFC-0116: every role resolves in every theme).
[tokens]
background = "#000000"
label = "#ffffff"
labelSecondary = "#e6e6e6"
labelTertiary = "#b3b3b3"
separator = "#ffffff"
fill = "#ffffff33"
fillHover = "#ffffff40"
fillActive = "#ffffff66"
glassPanel = "#000000f2"
glassWindow = "#000000f2"
glassCard = "#1a1a1a"
glassOverlay = "#000000f2"
glassEdge = "#ffffff"
surfacePane = "#000000"
surfaceOverlay = "#0a0a0a"
scrim = "#000000b3"
primary = "#ffffff"
onPrimary = "#000000"
accent = "#60a5fa"
accentGlow = "#60a5fa66"
onAccent = "#000000"
danger = "#ff4444"
success = "#44ff44"
warning = "#ffaa00"
wallpaperTint = "#000000b3"
labelShadow = "#000000"

[shadow.shadow1]
x = 0
y = 1
blur = 3
spread = 0
color = "#00000066"
inset = false

[shadow.shadow2]
x = 0
y = 4
blur = 12
spread = 0
color = "#00000066"
inset = false

[shadow.shadow3]
x = 0
y = 10
blur = 30
spread = 0
color = "#00000073"
inset = false

[shadow.shadow4]
x = 0
y = 25
blur = 50
spread = 0
color = "#00000099"
inset = false

[shadow.shadowInset]
x = 0
y = 1
blur = 2
spread = 0
color = "#00000059"
inset = true

[shadow.edgeHighlight]
x = 0
y = 1
blur = 0
spread = 0
color = "#ffffff4d"
inset = true

# No blur in high contrast: every backdrop is flat.
[material.ultraThin]
type = "backdrop"
blurRadiusDp = 0
saturationPct = 100
downsampleFactor = 2

[material.thin]
type = "backdrop"
blurRadiusDp = 0
saturationPct = 100
downsampleFactor = 2

[material.regular]
type = "backdrop"
blurRadiusDp = 0
saturationPct = 100
downsampleFactor = 2

[material.thick]
type = "backdrop"
blurRadiusDp = 0
saturationPct = 100
downsampleFactor = 2
