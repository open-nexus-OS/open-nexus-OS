# Clipboard surfaces (TASK-0067B): the search's Clipboard button + the keyboard
# toolbar's clipboard, emoji and keyboard-return entries.
"doc.on.clipboard" = "clipboard"
# The screenshot UI (TASK-0068): the capture panel's modes, the photo/film switch and the
# pointer toggle.
"rectangle.dashed" = "square-dashed"
"display" = "monitor"
"camera" = "camera"
