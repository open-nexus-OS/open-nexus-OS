[theme]
name = "base"
version = 2

# The design artifacts' token set (RFC-0116). Base carries the LIGHT values and every
# theme-invariant scale; dark and highcontrast override the roles that differ (the build of
# the typed tokens refuses a theme-varying role a variant does not author itself). Values are
# the artifacts' token file converted to hex: rgba alpha = round(a × 255); oklch through OKLab.

# ── Colour roles ────────────────────────────────────────────────────────────────────────────
[tokens]
# Page and text.
background = "#ffffff"
label = "#000000e0"
labelSecondary = "#0000008f"
labelTertiary = "#0000004d"
separator = "#0000001a"
# Control fills; hover and press are layers shown by opacity, never a background.
fill = "#78788029"
fillHover = "#0000000f"
fillActive = "#0000001f"
# The two blur surfaces, the layer on them, their edge.
glassPanel = "#ffffff80"
glassWindow = "#f6f7fae6"
glassCard = "#ffffff99"
glassOverlay = "#fcfcfed1"
glassEdge = "#ffffffcc"
# Opaque surfaces: the pane in a window, everything that floats.
surfacePane = "#fcfdff"
surfaceOverlay = "#fbfbfd"
scrim = "#00000047"
# Brand, tint, status.
primary = "#030213"
onPrimary = "#ffffff"
accent = "#2563eb"
accentGlow = "#3b82f64d"
onAccent = "#ffffff"
danger = "#d4183d"
success = "#16a34a"
warning = "#d97706"
# Mode toggles' on-states and the activity runner.
modeAirplane = "#f97316d9"
modeDesktop = "#14b8a6d9"
modeTablet = "#8b5cf6d9"
island = "#000000"
# Chart series (the same in both themes).
chart1 = "#f54900"
chart2 = "#009689"
chart3 = "#104e64"
chart4 = "#ffb900"
chart5 = "#fe9a00"
# The artifacts' readme: the wash over the wallpaper (white 20 % light, black 35 % dark); the
# component stylesheet: the halo behind an icon label on the wallpaper.
wallpaperTint = "#ffffff33"
labelShadow = "#ffffffb3"
transparent = "#00000000"

# ── Scales (theme-invariant) ───────────────────────────────────────────────────────────────
# The spacing grid itself (0 2 4 6 8 12 16 20 24 32 40 48 px) is a closed list in code; these
# are its semantic names.
[spacing]
gapInline = 8
gapGroup = 12
gapSection = 24
marginLayout = 16

# Containers are concentric: the outermost `xl`, an inner one parent − padding (never below sm).
[radius]
sm = 8
md = 12
lg = 16
xl = 24
full = 9999

# The outer height of every control of a size.
[control]
xs = 24
sm = 30
md = 36
lg = 44
xl = 52

# Motion durations in ms (the curves are the typed tokens' cubic-beziers, TASK-0354).
[motion]
instant = 100
swift = 160
quick = 280
base = 400
slow = 500

# Stacking order (advisory).
[zindex]
base = 0
raised = 10
overlay = 20
modal = 30
topbar = 40
island = 50

# ── Text styles: size, line, weight, tracking (milli-em), case and figures together ─────────────────
# The lock screen's time: the design artifacts' display × 2 (128/128/300, −0.02 em, tabular digits).
[textStyle.clock]
size = 128
line = 128
weight = 300
trackingMilliEm = -20
case = "none"
figures = "tabular"

[textStyle.display]
size = 64
line = 64
weight = 300
trackingMilliEm = -20
case = "none"
figures = "proportional"

[textStyle.largeTitle]
size = 30
line = 36
weight = 700
trackingMilliEm = -20
case = "none"
figures = "proportional"

[textStyle.title1]
size = 24
line = 30
weight = 700
trackingMilliEm = -15
case = "none"
figures = "proportional"

[textStyle.title2]
size = 20
line = 26
weight = 600
trackingMilliEm = -10
case = "none"
figures = "proportional"

[textStyle.title3]
size = 17
line = 22
weight = 600
trackingMilliEm = -5
case = "none"
figures = "proportional"

[textStyle.headline]
size = 15
line = 20
weight = 600
trackingMilliEm = 0
case = "none"
figures = "proportional"

[textStyle.body]
size = 14
line = 20
weight = 400
trackingMilliEm = 0
case = "none"
figures = "proportional"

[textStyle.subheadline]
size = 13
line = 18
weight = 400
trackingMilliEm = 0
case = "none"
figures = "proportional"

[textStyle.footnote]
size = 12
line = 16
weight = 400
trackingMilliEm = 0
case = "none"
figures = "proportional"

[textStyle.caption]
size = 11
line = 14
weight = 500
trackingMilliEm = 10
case = "none"
figures = "proportional"

[textStyle.caption2]
size = 10
line = 13
weight = 500
trackingMilliEm = 20
case = "none"
figures = "proportional"

[textStyle.overline]
size = 11
line = 14
weight = 600
trackingMilliEm = 60
case = "upper"
figures = "proportional"

# ── Shadows (light values; dark overrides the colours) ────────────────────────────────────
[shadow.shadow1]
x = 0
y = 1
blur = 3
spread = 0
color = "#0000001f"
inset = false

[shadow.shadow2]
x = 0
y = 4
blur = 12
spread = 0
color = "#00000024"
inset = false

[shadow.shadow3]
x = 0
y = 10
blur = 30
spread = 0
color = "#00000029"
inset = false

[shadow.shadow4]
x = 0
y = 25
blur = 50
spread = 0
color = "#00000033"
inset = false

[shadow.shadowInset]
x = 0
y = 1
blur = 2
spread = 0
color = "#0000002e"
inset = true

[shadow.edgeHighlight]
x = 0
y = 1
blur = 0
spread = 0
color = "#ffffffd9"
inset = true

# ── Backdrop materials: only the one surface on the wallpaper blurs ───────────────────────
[material.ultraThin]
type = "backdrop"
blurRadiusDp = 8
saturationPct = 100
downsampleFactor = 2

[material.thin]
type = "backdrop"
blurRadiusDp = 20
saturationPct = 100
downsampleFactor = 2

[material.regular]
type = "backdrop"
blurRadiusDp = 40
saturationPct = 180
downsampleFactor = 2

[material.thick]
type = "backdrop"
blurRadiusDp = 64
saturationPct = 180
downsampleFactor = 4

# ── Icon-set linkage (the MAINTAINED vendor repo; licence-clean import) ──────
# `path` = repo-relative SVG directory; `[icons.symbols]` = OUR SwiftUI-style
# symbol vocabulary → file stems. The icon build imports exactly these.
[icons]
path = "resources/icons/lucide/icons"
# The project's own glyphs (a symbol file `nexus:<stem>`), drawn on the vendor set's grid and stroke.
own = "resources/icons/nexus"

[icons.symbols]
"chevron.left" = "chevron-left"
"chevron.right" = "chevron-right"
"chevron.up" = "chevron-up"
"chevron.down" = "chevron-down"
"plus" = "plus"
"minus" = "minus"
"xmark" = "x"
"checkmark" = "check"
"star" = "star"
"calculator" = "calculator"
"square" = "square"
"play" = "play"
