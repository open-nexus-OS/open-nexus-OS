# File-manager window (design_handoff_files_window). The first four were USED by
# stash/settings without an entry here — a symbol name travels as a prop STRING,
# so the checker never sees it and `registry/widgets.rs` painted its honest grey
# placeholder box instead. Kept as their own block so the omission stays visible.
"square.grid.2x2" = "grid-2x2"
"arrow.clockwise" = "refresh-cw"
"arrow.uturn.backward" = "undo-2"
"calendar" = "calendar"
# The handoff uses BOTH ellipses: vertical in the window toolbar ("Mehr"),
# horizontal in the floating action bar. They are different glyphs, not a
# rotation, so both are imported.
"ellipsis.vertical" = "ellipsis-vertical"
"doc.text" = "file-text"
"shippingbox" = "box"
"square.pencil" = "square-pen"
