"arrow.down" = "arrow-down"
# Window chrome (design_handoff_open_nexus_os window frame) + window apps.
"ellipsis" = "ellipsis"
"sidebar.left" = "panel-left"
"sidebar.right" = "panel-right"
"folder" = "folder"
"doc" = "file"
"square.and.arrow.up" = "share-2"
"pencil" = "pencil"
