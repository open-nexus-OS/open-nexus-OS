# File-manager window (design artifacts: files window). The first four were USED by
# stash/settings without an entry here — a symbol name travels as a prop STRING,
# so the checker never sees it and `registry/widgets.rs` painted its honest grey
# placeholder box instead. Kept as their own block so the omission stays visible.
"square.grid.2x2" = "grid-2x2"
"arrow.clockwise" = "refresh-cw"
"arrow.uturn.backward" = "undo-2"
"calendar" = "calendar"
# The design uses BOTH ellipses: vertical in the window toolbar ("Mehr"),
# horizontal in the floating action bar. They are different glyphs, not a
# rotation, so both are imported.
"ellipsis.vertical" = "ellipsis-vertical"
"doc.text" = "file-text"
"shippingbox" = "box"
"square.pencil" = "square-pen"
# Settings window (design artifacts: settings window). Its row glyphs are the
# one part of the design nothing else in the shell needed: connectivity,
# peripherals, audio in/out, security and device info. Names follow the same
# SwiftUI-style vocabulary as the block above ("*.slash" for a struck-through
# variant, matching "wifi"/"bell").
"wifi.slash" = "wifi-off"
"bell.slash" = "bell-off"
"cylinder" = "database"
"iphone" = "smartphone"
"slider.vertical.3" = "sliders-vertical"
"keyboard" = "keyboard"
"computermouse" = "mouse"
