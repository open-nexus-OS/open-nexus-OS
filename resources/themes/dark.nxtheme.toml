[theme]
name = "dark"
version = 1

# Dark overrides only what differs from base (qualifier chain falls back to base
# for anything omitted). See docs/dev/ui/foundations/visual/token-reconciliation.md.
[tokens]
# modal/sheet backdrop dim (handoff dark --glass-scrim rgba(0,0,0,.45))
scrim = "#00000073"
accent = "#60a5fa"
accentFg = "#0a0a0a"
# handoff .dark neutrals: bg/card oklch(0.145)=#0a0a0a; secondary/muted/accent/
# border oklch(0.269)=#262626; muted-fg oklch(0.708)=#a1a1a1; ring 0.439=#525252.
# surface uses the sidebar tone oklch(0.205)=#171717 so panels still separate
# from the desktop background (handoff dark cards are flat + border).
bg = "#0a0a0a"
fg = "#fafafa"
surface = "#171717"
surfaceAlt = "#262626"
border = "#262626"
# translucent hairline (handoff dark divider rgba(255,255,255,.10))
divider = "#ffffff1a"
muted = "#262626"
mutedFg = "#a1a1a1"
focusRing = "#60a5fa"
# brand / chrome (handoff dark — oklch→hex)
primary = "#fafafa"
primaryFg = "#171717"
card = "#0a0a0a"
cardFg = "#fafafa"
popover = "#0a0a0a"
popoverFg = "#fafafa"
secondary = "#262626"
secondaryFg = "#fafafa"
destructive = "#fa5a55"
# sidebar (handoff dark)
sidebar = "#171717"
sidebarFg = "#fafafa"
sidebarPrimary = "#1447e6"
sidebarPrimaryFg = "#fafafa"
sidebarAccent = "#262626"
sidebarAccentFg = "#fafafa"
sidebarBorder = "#262626"
# charts (handoff dark)
chart1 = "#1447e6"
chart2 = "#00bc7d"
chart3 = "#fe9a00"
chart4 = "#ad46ff"
chart5 = "#ff2056"
# text-on-glass + interaction washes (dark theme = light ink)
glassTextPrimary = "#fffffff2"
glassTextSecondary = "#ffffff99"
glassTextStrong = "#ffffffff"
glassHover = "#ffffff26"
glassActive = "#ffffff33"
# On-glass control ink (RFC-0082 — the login handoff's dark column).
glassIcon = "#ffffffd9"
glassPlaceholder = "#ffffff73"
glassFocus = "#ffffff8c"
glassFill = "#ffffff33"
# Wallpaper legibility: dark mode leans on a much denser tint (the handoff's
# 55% black) because light ink over a bright photo is the harder direction.
wallpaperTint = "#0000008c"
wallpaperVignette = "#00000080"
# Dark ink is light, so the shadow flips to black — a drop shadow proper.
textShadow = "#00000066"
textShadowStrong = "#000000b3"
toggleOffBg = "#ffffff24"
glassTint = "#171717"
glassEdge = "#ffffff54"

[material.surface]
type = "opaque"

# Dark liquid-glass materials (handoff .dark values).
# RFC-0082: the login handoff's dark glass is a DARK tint (rgba(18,18,20,.4)),
# not the white wash these levels used to carry — over a photograph a white
# wash greys the image out instead of sinking into it.
[material.glassPanel]
type = "glass"
blurRadiusDp = 40
downsampleFactor = 4
tintColor = "#121214"
tintAlpha = 0.40
edgeHighlightColor = "#ffffff"
edgeHighlightAlpha = 0.08
borderColor = "#ffffff"
borderAlpha = 0.10

[material.glassCard]
type = "glass"
blurRadiusDp = 20
downsampleFactor = 2
tintColor = "#121214"
tintAlpha = 0.40
edgeHighlightColor = "#ffffff"
edgeHighlightAlpha = 0.08
borderColor = "#ffffff"
borderAlpha = 0.10

[material.glassSubtle]
type = "glass"
blurRadiusDp = 12
downsampleFactor = 2
tintColor = "#ffffff"
tintAlpha = 0.06
edgeHighlightColor = "#ffffff"
edgeHighlightAlpha = 0.05
borderColor = "#ffffff"
borderAlpha = 0.10

[material.glassWindow]
type = "glass"
blurRadiusDp = 40
downsampleFactor = 2
tintColor = "#34363e"
tintAlpha = 0.82
tintBottomColor = "#20222a"
tintBottomAlpha = 0.74
edgeHighlightColor = "#ffffff"
edgeHighlightAlpha = 0.14
borderColor = "#ffffff"
borderAlpha = 0.12

[material.glassOverlay]
type = "glass"
blurRadiusDp = 40
downsampleFactor = 2
tintColor = "#222734"
tintAlpha = 0.80
edgeHighlightColor = "#ffffff"
edgeHighlightAlpha = 0.16
borderColor = "#ffffff"
borderAlpha = 0.16
