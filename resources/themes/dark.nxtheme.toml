[theme]
name = "dark"
version = 2

# Dark overrides every role and shadow colour that differs from light (RFC-0116); the values are
# the design artifacts' dark token values converted to hex.
[tokens]
background = "#0a0a0a"
label = "#ffffffeb"
labelSecondary = "#ffffff94"
labelTertiary = "#ffffff4d"
separator = "#ffffff1a"
fill = "#78788052"
fillHover = "#ffffff1a"
fillActive = "#ffffff2e"
glassPanel = "#ffffff1a"
glassWindow = "#2a2c34d1"
glassCard = "#ffffff14"
glassOverlay = "#222734cc"
glassEdge = "#ffffff24"
surfacePane = "#2c313d"
surfaceOverlay = "#252833"
scrim = "#00000073"
primary = "#fafafa"
onPrimary = "#171717"
accent = "#3b82f6"
danger = "#fa5a55"
success = "#22c55e"
warning = "#f59e0b"
wallpaperTint = "#00000059"
labelShadow = "#0000008c"

[shadow.shadow1]
x = 0
y = 1
blur = 3
spread = 0
color = "#00000066"
inset = false

[shadow.shadow2]
x = 0
y = 4
blur = 12
spread = 0
color = "#00000066"
inset = false

[shadow.shadow3]
x = 0
y = 10
blur = 30
spread = 0
color = "#00000073"
inset = false

[shadow.shadow4]
x = 0
y = 25
blur = 50
spread = 0
color = "#00000099"
inset = false

[shadow.shadowInset]
x = 0
y = 1
blur = 2
spread = 0
color = "#00000059"
inset = true

[shadow.edgeHighlight]
x = 0
y = 1
blur = 0
spread = 0
color = "#ffffff24"
inset = true
