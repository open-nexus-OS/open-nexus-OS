[allow]
samgrd = ["ipc.core", "time.read"]
bundlemgrd = ["fs.read", "fs.verify", "ipc.core"]
keystored = ["crypto.sign", "crypto.verify", "ipc.core", "rng.entropy", "device.keygen", "policy.delegate", "statefs.keystore"]
statefsd = ["ipc.core", "policy.delegate", "device.mmio.blk"]
# TASK-0051B: `crash.attach.stack` = conservative default attachment level
# for at-rest crash artifacts (bounded stack/code previews). `crash.attach.full`
# is intentionally NOT granted — the deny is the redaction proof.
# `statefs.crash` = the /state/crash/ prefix capability (artifact writer +
# retention GC) — NOT the generic `statefs.write`.
execd = ["proc.spawn", "ipc.core", "fs.read", "crash.attach.stack", "statefs.crash"]
"packagefsd" = ["ipc.core", "fs.read"]
"vfsd" = ["ipc.core", "device.mmio.blk"]
# TASK-0049B PR-B3c: init persists supervision restart counters at
# /state/init/restarts/* (statefs.write covers PUT+SYNC; statefs.read the
# read-back). No statefs.boot/admin — init is a regular record client here.
"init-lite" = ["proc.spawn", "ipc.core", "fs.read", "policy.delegate", "statefs.read", "statefs.write", "boot.target", "boot.reset"]
"nexus-init" = ["proc.spawn", "ipc.core", "fs.read", "policy.delegate", "statefs.read", "statefs.write", "boot.target", "boot.reset"]
# TASK-0140: `policy.delegate` makes updated an authorized enforcement
# point — it asks policyd whether the SENDER holds `updates.manage`
# before any mutating op (the bootctld/statefsd pattern).
updated = ["crypto.verify", "ipc.core", "statefs.boot", "policy.delegate"]
# TASK-0050 (ADR-0055): the single boot-state authority — /state/boot/* is
# gated on statefs.boot for BOTH reads and writes (prefix rule).
bootctld = ["ipc.core", "statefs.boot", "policy.delegate"]
dsoftbusd = ["ipc.core", "statefs.read", "statefs.write"]
# TASK-0049C: logd persists evidence-class records under /state/logd/
# (statefs.write covers PUT/TXN/SYNC; statefs.read the boot-time ring load).
logd = ["ipc.core", "statefs.read", "statefs.write"]
metricsd = ["ipc.core", "statefs.write"]
# timed routes to metricsd to report timer metrics — surfaced by the new
# !route-deny marker as a previously-silent denial (it lacked ipc.core).
timed = ["ipc.core", "device.mmio.rtc"]
# imed routes to windowd to push composed text for the focused surface
# (RFC-0075); without ipc.core the name-route is !route-deny'd. statefs
# read/write (TASK-0204): imed persists its adaptive-ranking personalization
# store under state:/ime/<lang>/… (never typed field text — committed
# candidates only; password fields never train).
imed = ["ipc.core", "statefs.read", "statefs.write"]
# inputd routes to imed by name to forward resolved keys (RFC-0075) — its
# windowd leg predates name-routing (fixed fallback slots), so the missing
# grant only surfaced as `!route-deny: inputd -> imed`.
inputd = ["ipc.core"]
# `policy.delegate`: netstackd is an RFC-0091 enforcement seam (TASK-0043 P2) —
# it names the kernel-attributed subject it serves in OP_ABI_EVAL.
netstackd = ["device.mmio.net", "ipc.core", "policy.delegate"]
virtioblkd = ["device.mmio.blk", "ipc.core"]
rngd = ["device.mmio.rng", "ipc.core", "policy.delegate"]
"hidrawd" = ["device.mmio.input", "ipc.core"]
"gpud" = ["device.mmio.gpu", "ipc.core"]
# RFC-0065/0066: the ability lifecycle broker may route, query the bundle registry,
# and spawn apps (the "only abilitymgr spawns apps" invariant). windowd queries the
# registry for the dynamic Apps menu. Without `ipc.core` here, their route requests
# are policy-denied → "unreachable" (the bug this fixes).
# TASK-0065B: `session.query` = talk to sessiond (windowd relays the greeter
# login; abilitymgr gates app launches on session state).
"abilitymgr" = ["ipc.core", "bundle.query", "proc.spawn", "session.query"]
# TASK-0072 P10: `settings.query` = talk to settingsd (GET/SET ui.theme.mode);
# routing itself is gated on `ipc.core`, this documents the intended target.
"windowd" = ["ipc.core", "bundle.query", "session.query", "settings.query"]
# sessiond answers session queries only; it calls nobody.
sessiond = ["ipc.core"]
# TASK-0072 Phase 8: settingsd persists the typed prefs registry via statefsd
# (state:/prefs) — needs ipc.core to route + statefs read/write to load at boot
# and store on change.
settingsd = ["ipc.core", "statefs.read", "statefs.write"]
# pinched (system-internal compute broker): routes only to resolve its own
# server endpoint at boot; it calls no other service.
pinched = ["ipc.core"]
# TASK-0025: `crypto.derive.statefs` lets the selftest derive the statefs
# envelope MAC key via keystored OP_DEVICE_SIGN — but ONLY over the fixed
# label "statefs.envelope.v1" (rule: statefs::derive::device_sign_allowed).
# Deliberately NOT `crypto.sign`: generic device-signing power stays denied
# (the `keystored sign denied` selftest guards exactly that).
# `statefs.crash` (TASK-0051B): the demo.minidump child's PUT maps to this
# subject (canonical_policy_subject_for_statefs) and the artifact probe GETs
# `/state/crash/` — the prefix now has its own capability.
"selftest-client" = ["ipc.core", "proc.spawn", "rng.entropy", "crypto.derive.statefs", "device.keygen", "device.pubkey.read", "device.key.reload", "device.mmio.net", "device.mmio.input", "statefs.read", "statefs.write", "statefs.crash", "statefs.boot", "statefs.admin", "boot.target", "boot.reset", "updates.manage", "policy.abi_mode"]
"demo.testsvc" = []

# RFC-0091 profile v2 (schema SSOT: userspace/policy/src/schema.rs; both
# parsers compile the same rules). Precedence: most specific rule wins,
# deny beats allow, no rule = deny. `epoch` is monotone per subject —
# bump it with every behavioural change (mode switches are epoch-guarded).
[abi_profile."selftest-client"]
epoch = 2

[abi_profile."selftest-client".limits]
deadline_ms = 2000
max_payload = 4096

# A governed subject's profile must name EVERY prefix it legitimately
# writes (the seam refuses everything else): the selftest's own trees, the
# boot/crash records its probes write, the enc-rotation admin key, and the
# remote-rw proof key. `secrets/` under the allowed tree is the narrower
# deny the `SELFTEST: abi enforce deny ok` proof relies on.
[[abi_profile."selftest-client".statefs]]
action = "allow"
prefix = "/state/app/selftest/"

[[abi_profile."selftest-client".statefs]]
action = "deny"
prefix = "/state/app/selftest/secrets/"

[[abi_profile."selftest-client".statefs]]
action = "allow"
prefix = "/state/selftest/"

[[abi_profile."selftest-client".statefs]]
action = "allow"
prefix = "/state/boot/"

[[abi_profile."selftest-client".statefs]]
action = "allow"
prefix = "/state/crash/"

[[abi_profile."selftest-client".statefs]]
action = "allow"
prefix = "/state/statefsd/"

[[abi_profile."selftest-client".statefs]]
action = "allow"
prefix = "/state/shared/selftest/"

[[abi_profile."selftest-client".net.bind]]
action = "allow"
ports = ["1024-65535"]
address = "loopback"

[[abi_profile."selftest-client".net.connect]]
action = "allow"
cidr = "10.0.2.0/24"
ports = ["53", "80", "443"]

# RFC-0072 amendment (TASK-0043): per-subject byte quota on /state, enforced by
# statefsd at the put seam. Attribution by prefix set; soft ⇒ warn once per
# boot, hard ⇒ EDQUOTA before the journal append. The selftest's quota tree is
# tiny on purpose (the `SELFTEST: quota deny ok` proof fills it in three puts).
[quota."selftest-client"]
prefixes = ["/state/app/selftest/quota/"]
soft_bytes = 256
hard_bytes = 512
