# CONTEXT: window-kit — the shared DSL component library for the
# design-handoff WINDOW look (top chrome with slots, menu items, floating
# action bar, sidebar rows, property rows). `bundle_type = "library"`:
# contributes `Component` declarations ONLY (TASK-0081 C3); consuming apps
# name it in `dependencies` and the components compile INTO their .nxir.
#
# `WinAppWindow` (RFC-0084) is the three-zone body — sidebar · content ·
# properties — as content SLOTS. Every region is transparent; the panel-glass
# background behind one is a per-region prop
# (`sidebarPanel`/`contentPanel`/`propsPanel`), so an app decides zero, one or
# several panels per region instead of inheriting a hard-coded pane.
#   slots  sidebar · content · properties
#   props  sidebarPanel/contentPanel/propsPanel · showSidebar/showProps (Bool)
#
# STORE CONTRACT (the consuming app declares these — the kit dispatches):
#   fields  menu: Str · leftOpen: Int · rightOpen: Int · tool: Str ·
#           selection: Str
#   events  WinMenu(Str) · WinMenuPick(Str) · WinNoop · WinLeft · WinRight ·
#           WinTool(Str) · WinAct(Str)
#   (WinNoop = consume-tap for panel bodies inside the menu overlay; the
#   overlay layer itself dispatches WinMenu("") as the outside-close.)
#   WinAppWindow mounts the WINDOW MENU itself (`menu == "app"`, TASK-0066):
#   the tile glyph rows (WinAct("zone.<name>")), fullscreen, move-to-device
#   (inert), minimize, close — labels via props menuFullscreen/menuMoveDevice/
#   menuMinimize/menuClose. Apps mount no app-chip dropdown of their own.
#
# OVERLAYS (TASK-0074 / ADR-0068 — the design handoff's Alert · Modal · Toast
# as `.overlay(modal|transient)` compositions; the runtime owns confinement,
# ESC/backdrop/timeout dismissal, windowd owns ONE routing verb):
#   WinAlert   props id/title/message/cancelLabel/confirmLabel/destructive
#              events AlertConfirm(Str) · AlertCancel(Str) · WinNoop
#   WinModal   props id/title · slots body · footer
#              events ModalClose(Str) · WinNoop
#   WinToast   props id/icon/title/subtitle · events ToastDismiss(Str)

name = "window-kit"
version = "0.1.0"
min_sdk = "1.0.0"
bundle_type = "library"
payload_kind = "library"
abilities = []
caps = []
provides = []
resources = []
