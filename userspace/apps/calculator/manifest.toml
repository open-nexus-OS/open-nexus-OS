#
# CONTEXT: Calculator — built to `docs/design_handoff_calculator` (TASK-0314):
# decimals with locale separators, %, ±, two-stage AC/C, history line and an
# error state, on a keypad that divides exactly at any window size and sizes
# its labels from their own keys. Still the DSL animation demo (the display
# carries `.animate` + `.effect`). Launched via
# abilitymgr → execd → app-host, presenting through its own cross-process
# windowd surface (ADR-0042).
# Compiled to `manifest.nxb` (Cap'n Proto) by `tools/nxb-pack` and installed
# into the `bundlemgrd` registry; `abilitymgr` resolves the launch from here.
# Schema: tools/nexus-idl/schemas/manifest.capnp  ·  Docs: docs/packaging/nxb.md
#
# NOTE: `publisher`/`sig` are zero placeholders (unsigned bring-up bundle).

name = "calculator"
version = "0.1.0"
min_sdk = "1.0.0"
bundle_type = "app"
# Launcher tile glyph (theme icon-set symbol, resources/themes [icons.symbols]).
icon = "calculator|#3d4757|#1a202c"
# Real app-icon artwork (SVG in the bundle's assets/), rasterized at build
# time by nexus-app-icons; the packed `icon` string stays the fallback glyph.
icon_svg = "assets/icon.svg"
payload_kind = "ui-program"
abilities = ["calculator.MainAbility"]
caps = ["nexus.permission.WINDOW"]
provides = []
resources = []
