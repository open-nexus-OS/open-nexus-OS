    if (v === null || v === undefined || v === 'Fehler') return v === 'Fehler' ? 'Fehler' : '';
    const str = String(v);
    const neg = str.charAt(0) === '-';
    const body = neg ? str.slice(1) : str;
    const parts = body.split('.');
    let int = parts[0];
    if (this.props.groupThousands !== false) int = int.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const dec = parts[1] !== undefined ? this._mark() + parts[1] : '';
    return (neg ? '−' : '') + int + dec;
  }

  renderVals() {
    const ic = (p, sz, sw, c) => this._ic(p, sz, sw, c);
    const mi = (label, icon, onClick) => React.createElement('button', {
      type: 'button', onClick,
      style: { display: 'flex', alignItems: 'center', gap: 9, width: '100%', padding: '8px 12px', border: 'none', background: 'transparent', cursor: 'pointer', font: 'inherit', fontSize: 12.5, color: 'var(--glass-text-primary)', textAlign: 'left', borderRadius: 8 },
      onMouseEnter: (e) => { e.currentTarget.style.background = 'rgba(255,255,255,0.08)'; },

      mi('Ergebnis kopieren', ic('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', 14, 2, 'var(--glass-text-secondary)'), () => {
        const t = this._fmt(this.state.disp);
        if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {});
        this.setState({ appMenuOpen: false });
      }),
    ) : null;
    const leading = React.createElement('div', { style: { position: 'relative', display: 'flex', alignItems: 'center', gap: 8 } },
      React.createElement('div', {
        onClick: () => this.setState((s) => ({ appMenuOpen: !s.appMenuOpen })),
        style: { display: 'flex', alignItems: 'center', gap: 2, cursor: 'pointer' },
      },
        React.createElement('img', { src: 'assets/icons/calculator.svg', alt: '', style: { width: 30, height: 30, display: 'block', flexShrink: 0 } }),
        ic('<path d="m6 9 6 6 6-6"/>', 11, 2.5, 'var(--glass-text-secondary)'),
      ),
      React.createElement('span', { style: { fontSize: 12.5, fontWeight: 500, color: 'var(--glass-text-primary)' } }, 'Rechner'),
      appMenu,
    );

    const shown = this._fmt(this.state.disp);
    const len = String(shown).length;
    return {
      winW: 392, winH: 616,
      bodyStyle: { padding: '0 8px 12px 8px', minHeight: 0 },
      accent: this.props.accent || '#3b82f6',
      leading,
      expr: this.state.expr,
      disp: shown,
      dispSize: len > 13 ? '30px' : len > 9 ? '38px' : '52px',
      decimalMark: this._mark(),
      clearLabel: (this.state.disp !== '0' || !this.state.fresh) ? 'C' : 'AC',
      k0: () => this._digit('0'), k1: () => this._digit('1'), k2: () => this._digit('2'),
      k3: () => this._digit('3'), k4: () => this._digit('4'), k5: () => this._digit('5'),
      k6: () => this._digit('6'), k7: () => this._digit('7'), k8: () => this._digit('8'),
      k9: () => this._digit('9'),
      onDot: () => this._dot(),
      onAdd: () => this._op('+'), onSub: () => this._op('−'), onMul: () => this._op('×'), onDiv: () => this._op('÷'),
      onEquals: () => this._eq(), onClear: () => this._clear(), onSign: () => this._sign(), onPercent: () => this._pct(),
      noop: () => {},
    };
  }
