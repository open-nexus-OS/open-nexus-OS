<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="OS Login" description="Sperr-/Anmeldebildschirm für Desktop, Tablet und Phone — Wallpaper, Live-Uhr, Avatar, Passwortfeld mit Shake-Feedback, Benutzerwechsler und Power-Aktionen. Fluid responsiv über clamp()/min(), keine Breakpoint-Duplikate." -->
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="./ds-base.js"></script>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { width:100%; height:100%; }
    body { font-family:'Inter',-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
    @keyframes nx-login-in { from { opacity:0; transform:translateY(14px) scale(0.985); filter:blur(6px); } to { opacity:1; transform:translateY(0) scale(1); filter:blur(0); } }
    @keyframes nx-clock-in { from { opacity:0; transform:translateY(-10px); filter:blur(8px); } to { opacity:1; transform:translateY(0); filter:blur(0); } }
    @keyframes nx-shake { 10%,90% { transform:translateX(-1px); } 20%,80% { transform:translateX(3px); } 30%,50%,70% { transform:translateX(-6px); } 40%,60% { transform:translateX(6px); } }
    @keyframes nx-unlock { to { opacity:0; transform:scale(1.06); filter:blur(18px); } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }
    input::placeholder { color:var(--nx-placeholder); }
    input:focus { outline:none; }
    /* Runtime-Zustände (Submit/Fokus/Fehler) — als Klassen, Basis-Styles bleiben inline */
    .nx-unlocking { animation:nx-unlock 0.6s cubic-bezier(0.4,0,0.2,1) forwards !important; }
    .nx-field { border-color:var(--nx-glass-border); }
    .nx-theme-light { --nx-tint:rgba(255,255,255,0.24); --nx-vignette:rgba(255,255,255,0.45); --nx-glass-bg:rgba(255,255,255,0.5); --nx-glass-border:rgba(255,255,255,0.7); --nx-accent-bg:rgba(255,255,255,0.6); --nx-glass-highlight:rgba(255,255,255,0.6); --nx-text-1:rgba(20,20,26,0.95); --nx-text-2:rgba(20,20,26,0.68); --nx-icon:rgba(20,20,26,0.8); --nx-shadow:rgba(255,255,255,0.7); --nx-shadow-strong:rgba(255,255,255,0.95); --nx-placeholder:rgba(20,20,26,0.5); --nx-focus:rgba(20,20,26,0.5); }
    .nx-theme-dark { --nx-tint:rgba(0,0,0,0.55); --nx-vignette:rgba(0,0,0,0.5); --nx-glass-bg:rgba(18,18,20,0.4); --nx-glass-border:rgba(255,255,255,0.10); --nx-accent-bg:rgba(255,255,255,0.20); --nx-glass-highlight:rgba(255,255,255,0.08); --nx-text-1:rgba(255,255,255,0.95); --nx-text-2:rgba(255,255,255,0.6); --nx-icon:rgba(255,255,255,0.85); --nx-shadow:rgba(0,0,0,0.4); --nx-shadow-strong:rgba(0,0,0,0.7); --nx-placeholder:rgba(255,255,255,0.45); --nx-focus:rgba(255,255,255,0.55); }
    .nx-field.is-focus { border-color:var(--nx-focus); box-shadow:0 12px 32px rgba(0,0,0,0.35), 0 0 0 4px var(--nx-glass-highlight), inset 0 1px 0 rgba(255,255,255,0.2); }
    .nx-field.is-error { border-color:rgba(255,110,120,0.65); animation:nx-shake 0.5s cubic-bezier(0.36,0.07,0.19,0.97) both; }
  </style>
</helmet>

<div data-screen-label="Login" class="{{ themeClass }}" style="position:fixed; inset:0; background:#0d1117; overflow:hidden;">
  <img src="{{ wallpaperUrl }}" alt="" draggable="false" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;"></img>
  <!-- Tint: hält Text auf Wallpaper lesbar ohne das Bild zu töten -->
  <div style="position:absolute; inset:0; background:var(--nx-tint);"></div>
  <!-- Vignette unten für Switcher/Power-Lesbarkeit -->
  <div style="position:absolute; inset:0; background:linear-gradient(to top, var(--nx-vignette), transparent 30%);"></div>

  <!-- Entsperrter Zustand: nur Wallpaper + Hinweis -->
  <sc-if value="{{ unlocked }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; padding-bottom:48px; z-index:5;">
      <button onClick="{{ relock }}" style="border:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:500; color:var(--nx-text-1); background:var(--nx-glass-bg); border:1px solid var(--nx-glass-border); backdrop-filter:blur(40px); -webkit-backdrop-filter:blur(40px); padding:10px 22px; border-radius:9999px; box-shadow:0 12px 30px rgba(0,0,0,0.35); transition:transform 0.35s cubic-bezier(0.34,1.4,0.5,1), background 0.2s ease;" style-hover="background:rgba(255,255,255,0.18); transform:scale(1.05);" style-active="transform:scale(0.95);">Wieder sperren</button>
    </div>
  </sc-if>

  <!-- Gesperrter Zustand -->
  <sc-if value="{{ locked }}" hint-placeholder-val="{{ true }}">
    <div class="{{ lockLayerClass }}" style="position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:clamp(28px,6vh,64px) clamp(16px,4vw,48px);">

      <!-- Uhr -->
      <div style="text-align:center; color:var(--nx-text-1); animation:nx-clock-in 0.7s cubic-bezier(0.22,1,0.36,1) both;">
        <div style="font-size:clamp(15px,1.6vw,18px); font-weight:600; letter-spacing:0.02em; color:var(--nx-text-2); text-shadow:0 1px 3px var(--nx-shadow-strong), 0 1px 14px var(--nx-shadow-strong);">{{ dateLabel }}</div>
        <div style="font-size:clamp(64px,12vw,132px); font-weight:300; line-height:1.05; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; text-shadow:0 2px 24px var(--nx-shadow);">{{ timeLabel }}</div>
      </div>

      <!-- Login-Block -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:16px; animation:nx-login-in 0.65s cubic-bezier(0.34,1.4,0.5,1) 0.12s both; width:min(92vw,340px);">
        <div style="width:clamp(72px,9vw,96px); height:clamp(72px,9vw,96px); border-radius:50%; background:var(--nx-glass-bg); border:1px solid var(--nx-glass-border); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 12px 32px rgba(0,0,0,0.35), inset 0 1px 0 var(--nx-glass-highlight); display:flex; align-items:center; justify-content:center; font-size:clamp(26px,3.2vw,34px); font-weight:600; color:var(--nx-text-1); text-shadow:0 1px 6px var(--nx-shadow); transition:transform 0.45s cubic-bezier(0.34,1.4,0.5,1);">{{ activeInitials }}</div>
        <div style="font-size:clamp(17px,1.9vw,21px); font-weight:600; color:var(--nx-text-1); text-shadow:0 1px 10px var(--nx-shadow);">{{ activeName }}</div>

        <form onSubmit="{{ submit }}" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:10px;">
          <div class="nx-field {{ fieldStateClass }}" style="width:100%; display:flex; align-items:center; gap:8px; background:var(--nx-glass-bg); border:1px solid var(--nx-glass-border); backdrop-filter:blur(40px); -webkit-backdrop-filter:blur(40px); border-radius:9999px; padding:0 8px 0 20px; height:44px; box-shadow:0 12px 32px rgba(0,0,0,0.30), inset 0 1px 0 var(--nx-glass-highlight); transition:border-color 0.25s ease, box-shadow 0.35s ease;">
            <input type="password" placeholder="Passwort eingeben" value="{{ password }}" onChange="{{ onPassword }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" autoComplete="off" style="flex:1; min-width:0; background:transparent; border:none; font-family:inherit; font-size:15px; color:var(--nx-text-1); height:100%;"></input>
            <button type="submit" title="Anmelden" style="flex:none; width:30px; height:30px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--nx-accent-bg); color:var(--nx-icon); transition:transform 0.3s cubic-bezier(0.34,1.4,0.5,1), background 0.2s ease;" style-hover="background:rgba(255,255,255,0.28); transform:scale(1.08);" style-active="transform:scale(0.9);">{{ iconArrow }}</button>
          </div>
          <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:12.5px; font-weight:500; color:rgba(255,120,130,0.95); text-shadow:0 1px 6px rgba(0,0,0,0.4);">Passwort falsch — bitte erneut versuchen</div>
          </sc-if>
          <sc-if value="{{ showHint }}" hint-placeholder-val="{{ true }}">
            <div style="font-size:12.5px; font-weight:500; color:var(--nx-text-2); text-shadow:0 1px 2px var(--nx-shadow-strong), 0 1px 8px var(--nx-shadow-strong);">Mit Enter anmelden</div>
          </sc-if>
        </form>
      </div>

      <!-- Fußzeile: Benutzerwechsler + Power -->
      <div style="width:100%; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;">
        <sc-if value="{{ showSwitcher }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex; align-items:center; gap:14px;">
            <sc-for list="{{ otherUsers }}" as="u" hint-placeholder-count="2">
              <button onClick="{{ u.select }}" title="{{ u.name }}" style="border:none; cursor:pointer; background:transparent; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:6px; padding:0; transition:transform 0.35s cubic-bezier(0.34,1.4,0.5,1);" style-hover="transform:scale(1.07) translateY(-2px);" style-active="transform:scale(0.94);">
                <div style="width:44px; height:44px; border-radius:50%; background:var(--nx-glass-bg); border:1px solid var(--nx-glass-border); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--nx-text-1); box-shadow:0 6px 16px rgba(0,0,0,0.3);">{{ u.initials }}</div>
                <div style="font-size:11px; font-weight:600; color:var(--nx-text-2); text-shadow:0 1px 2px var(--nx-shadow-strong), 0 1px 8px var(--nx-shadow-strong);">{{ u.name }}</div>
              </button>
            </sc-for>
          </div>
        </sc-if>

        <div style="display:flex; align-items:center; gap:12px; margin-left:auto;">
          <sc-for list="{{ powerActions }}" as="p" hint-placeholder-count="3">
            <button onClick="{{ p.onClick }}" title="{{ p.label }}" style="border:none; cursor:pointer; font-family:inherit; width:44px; height:44px; border-radius:50%; background:var(--nx-glass-bg); border:1px solid var(--nx-glass-border); backdrop-filter:blur(40px); -webkit-backdrop-filter:blur(40px); color:var(--nx-icon); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,0.3); transition:transform 0.35s cubic-bezier(0.34,1.4,0.5,1), background 0.2s ease;" style-hover="background:rgba(255,255,255,0.20); transform:scale(1.08);" style-active="transform:scale(0.9);">{{ p.icon }}</button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 800 },
  &quot;userNames&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Jenning Schäfer, Suna Leem, Gast&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Benutzer&quot; },
  &quot;correctPassword&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;nexus&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Benutzer&quot; },
  &quot;showUserSwitcher&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Benutzer&quot; },
  &quot;showHint&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Darstellung&quot; },
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Darstellung&quot; },
  &quot;wallpaperUrl&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://images.unsplash.com/photo-1506905925346-21bda4d32df4?crop=entropy&amp;cs=tinysrgb&amp;fit=max&amp;fm=jpg&amp;q=80&amp;w=1920&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Darstellung&quot; },
  &quot;darkWallpaperUrl&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://images.unsplash.com/photo-1518770660439-4636190af475?crop=entropy&amp;cs=tinysrgb&amp;fit=max&amp;fm=jpg&amp;q=80&amp;w=1920&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Darstellung&quot; }
}">
class Component extends DCLogic {
  state = {
    password: '',
    focused: false,
    error: false,
    shakeKey: 0,
    phase: 'locked', // locked | unlocking | unlocked
    now: new Date(),
    activeIdx: 0,
  };

  componentDidMount() {
    this._t = setInterval(() => this.setState({ now: new Date() }), 1000);
  }
  componentWillUnmount() { clearInterval(this._t); if (this._unlockT) clearTimeout(this._unlockT); }

  _icon(paths) {
    return React.createElement('svg', {
      width: 17, height: 17, viewBox: '0 0 24 24', fill: 'none',
      stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
      dangerouslySetInnerHTML: { __html: paths },
    });
  }

  _users() {
    const names = (this.props.userNames ?? 'Anna Weber, Jonas Keller, Gast').split(',').map(s => s.trim()).filter(Boolean);
    return names.map(n => ({ name: n, initials: n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() }));
  }

  renderVals() {
    const { password, focused, error, phase, now, activeIdx, shakeKey } = this.state;
    const users = this._users();
    const active = users[activeIdx] ?? users[0] ?? { name: 'Benutzer', initials: 'B' };
    const correctPw = this.props.correctPassword ?? 'nexus';

    const time = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    const date = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });

    const submit = (e) => {
      e.preventDefault();
      if (password === correctPw || correctPw === '') {
        this.setState({ phase: 'unlocking', error: false });
        this._unlockT = setTimeout(() => this.setState({ phase: 'unlocked', password: '' }), 620);
      } else {
        this.setState({ error: true, password: '', shakeKey: shakeKey + 1 });
      }
    };

    const isDark = (this.props.theme ?? 'light') === 'dark';
    const lightWall = this.props.wallpaperUrl ?? 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1920';
    const darkWall = this.props.darkWallpaperUrl ?? 'https://images.unsplash.com/photo-1518770660439-4636190af475?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1920';

    return {
      wallpaperUrl: isDark ? darkWall : lightWall,
      themeClass: isDark ? 'nx-theme-dark' : 'nx-theme-light',
      locked: phase !== 'unlocked',
      unlocked: phase === 'unlocked',
      lockLayerClass: phase === 'unlocking' ? 'nx-unlocking' : '',

      dateLabel: date,
      timeLabel: time,

      activeName: active.name,
      activeInitials: active.initials,

      password,
      onPassword: (e) => this.setState({ password: e.target.value, error: false }),
      onFocus: () => this.setState({ focused: true }),
      onBlur: () => this.setState({ focused: false }),
      submit,
      fieldStateClass: error ? 'is-error' : (focused ? 'is-focus' : ''),
      showError: error,
      showHint: !error && (this.props.showHint ?? true),
      iconArrow: this._icon('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'),

      showSwitcher: (this.props.showUserSwitcher ?? true) && users.length > 1,
      otherUsers: users.map((u, i) => ({ ...u, select: () => this.setState({ activeIdx: i, password: '', error: false }) })).filter((_, i) => i !== activeIdx),

      powerActions: [
        { label: 'Ruhezustand', icon: this._icon('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'), onClick: () => {} },
        { label: 'Neustart', icon: this._icon('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'), onClick: () => {} },
        { label: 'Ausschalten', icon: this._icon('<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>'), onClick: () => {} },
      ],

      relock: () => this.setState({ phase: 'locked', password: '', error: false }),
    };
  }
}
</script>
</body>
</html>
