[package]
name = "nexus-text-baked"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "nexus_text_baked"
path = "src/lib.rs"

[features]
default = ["std", "embedded-atlas"]
# Host conveniences only; the renderer itself is no_std (the tables are
# baked at build time — no runtime font parsing anywhere).
std = []
# The pixel-real `MeasureText` implementation over these atlases (used by
# the DSL layout path in windowd's demo mount and the app-host runtime).
layout = ["dep:nexus-layout-types"]
# RFC-0080: link the ~4.25 MB coverage blob (`EMBEDDED_ATLAS`) as the DEFAULT
# atlas backing. windowd/host/tests + the VMO owner keep it ON; a consumer
# that maps a shared atlas VMO (app-host) turns it OFF so the blob never
# enters its image, and MUST `set_atlas_base` before the first render.
embedded-atlas = []

[dependencies]
nexus-layout-types = { path = "../layout-types", optional = true }

[build-dependencies]
ime-core = { path = "../../ime-core" }
keymaps = { path = "../../keymaps" }
fontdue = "0.9"
# RFC-0082: `fontdue` has no variation-axis API, so the Light/SemiBold rungs
# of the ladder are instanced on the `wght` axis here and filled by build.rs's
# own nonzero-winding scanline rasterizer. Regular 400 keeps going through
# `fontdue` so the 13/16 px coverage stays byte-identical. `gvar-alloc` lifts
# the stack-only point cap for the larger display outlines.
ttf-parser = { version = "0.24", features = ["gvar-alloc"] }
