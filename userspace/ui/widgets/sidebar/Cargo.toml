[package]
name = "nexus-widget-sidebar"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "nexus_widget_sidebar"
path = "src/lib.rs"

[dependencies]
nexus-layout-types = { path = "../../layout-types" }
nexus-theme-tokens = { path = "../../theme-tokens" }
nexus-widget-icon = { path = "../icon" }
nexus-widget-text = { path = "../text" }

[dev-dependencies]
# Geometry tests on the real engine and the baked text measure (the line boxes app-host uses).
nexus-layout = { path = "../../layout" }
nexus-text-baked = { path = "../../text-baked", features = ["layout"] }
