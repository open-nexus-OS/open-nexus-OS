[package]
name = "nexus-ipc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Open Nexus OS Contributors"]

[features]
default = ["std"]
std = []
os-lite = []
kernel-ipc = []

[dependencies]
nexus-abi = { path = "../../source/libs/nexus-abi" }
nexus-sync = { path = "../../source/libs/nexus-sync" }
# TASK-0324 P4f-6: the control channel every route ask travels on has one home.
nexus-service-topology = { path = "../../source/libs/nexus-service-topology" }
# TASK-0246 P4c: the socd client speaks the SoC glue wire (`nexus_wire::soc`).
nexus-wire = { path = "../../source/libs/nexus-wire" }
