[package]
name = "nexus-metrics"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["std"]
std = []
os-lite = ["dep:nexus-ipc", "nexus-ipc/os-lite", "nexus-ipc/kernel-ipc", "dep:nexus-abi"]

[dependencies]
nexus-ipc = { path = "../nexus-ipc", optional = true, default-features = false }
# Private CAP_MOVE reply inbox for the OS client (raw recv with a deadline).
nexus-abi = { path = "../../source/libs/nexus-abi", optional = true }
