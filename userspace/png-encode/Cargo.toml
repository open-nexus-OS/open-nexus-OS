[package]
name = "png-encode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Bounded-memory PNG encoder for screenshots (TASK-0068): BGRA8 in, RGB8 PNG streamed out through a sink; no_std + alloc, scratch allocated once, no dependencies"

[lib]
name = "png_encode"
path = "src/lib.rs"

# Round-trip tests decode our output with an independent decoder (checksums verified).
[dev-dependencies]
png = "0.17"
