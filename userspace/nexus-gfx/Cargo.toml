[package]
name = "nexus-gfx"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NexusGfx SDK v1: explicit command-based graphics API"

[lib]
name = "nexus_gfx"
path = "src/lib.rs"

[dependencies]
# The one SDF math SSOT — the canonical rasterizer rasterizes via its fixed-point
# AA coverage so the reference output matches the live compositor (RFC-0067 P5).
nexus-sdf = { path = "../ui/sdf" }
# Soft-float gaussian kernel for the separable backdrop blur (no_std, no FPU).
libm = "0.2"
# RFC-0101: the GPU's device-side vocabulary (queue kinds, cache modes, the timeline point,
# the GPU address space) is the driver-kit's — the client API names the same types, never a
# second vocabulary.
nexus-driverkit = { path = "../../source/libs/nexus-driverkit" }
