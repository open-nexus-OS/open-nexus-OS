[package]
name = "neuron"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Open Nexus OS Contributors"]

[features]
default = ["failpoints", "boot_banner", "selftest_priv_stack", "selftest_time", "timer_irq"]
failpoints = []
# Development-only verbose UART diagnostics (not enabled by default)
debug_uart = []
# Bounded, low-noise IPC trace ring (records events in-memory and dumps only on trigger).
ipc_trace_ring = []
# opt-in panic handler for no_std kernel images
panic_handler = []
boot_timing = []
timer_irq = []
selftest_priv_stack = []
boot_banner = []
selftest_full = []
selftest_time = []
selftest_ipc = []
selftest_caps = []
selftest_sched = []
selftest_map = []
trap_symbols = []
trap_ring = []
debug_stack_guards = []
debug_pt_verify = []
as_map_bisect_text_only = []
selftest_no_satp = []

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
bitflags = { version = "2", default-features = false }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "once"] }
linked_list_allocator = { version = "0.10.5", default-features = false }
riscv = { version = "0.11", default-features = false }
static_assertions = { version = "1", default-features = false }
# RFC-0068: shared, zero-dep, no_std verdict math (a leaf types crate, same category as the others
# above) — the kernel GROUP table folds into the SAME SSOT the services use, so OK/WARN-slow/ERROR
# can never drift between the two sides.
nexus-event = { path = "../../libs/nexus-event" }
# RFC-0098: the ONE reader of the hardware truth (TASK-0244 P3); no_std, alloc-free.
nexus-fdt = { path = "../../libs/nexus-fdt" }
# RFC-0118: `CpuSet`, the one definition of the set of logical CPUs on both sides of the ABI;
# no_std, zero deps, no unsafe.
nexus-sched = { path = "../../libs/nexus-sched" }
# RFC-0107 Phase 2: the console ring's one layout, shared with its reader; no_std, zero deps.
nexus-console-ring = { path = "../../libs/nexus-console-ring" }
# ADR-0081: the bootfs table's one codec, shared with the packer, the loader and init; no_std,
# zero deps, alloc-free in the kernel.
nexus-bootfs = { path = "../../libs/nexus-bootfs" }
# RFC-0100 §5: the page compressor of the backing stages (the compressed pool, memd's swap
# pager), one block format on both sides; no_std, zero deps, allocation-free.
nexus-compress = { path = "../../libs/nexus-compress" }
# RFC-0100 §5 (ADR-0088): the seal of a record that leaves the kernel for the swap partition —
# ChaCha20-Poly1305, pure Rust, in place, no `getrandom` (default features off); the same audited
# crate the Noise channel uses.
chacha20poly1305 = { version = "0.10", default-features = false }

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
sbi-rt = { version = "0.0.2", default-features = false }

[dev-dependencies]
proptest = "1.3"

[build-dependencies]
cc = "1"
