[package]
name = "nxboot"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "First-stage verified A/B boot loader (RFC-0089 §7, ADR-0059): BSB slot selection, NXBD verify against a build-baked anchor, measured handoff"
build = "build.rs"

[dependencies]
# Verify-only half of the boot-format codecs (no_std; NXBD verify, BSB
# double-block rule, handoff page). No std/sign features in the loader.
bootfmt = { path = "../../../userspace/bootfmt", default-features = false }

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
sbi-rt = { version = "0.0.2", default-features = false }

[dev-dependencies]
# Host tests sign fixture NXBDs to prove the baked anchor end-to-end.
bootfmt = { path = "../../../userspace/bootfmt", features = ["std", "sign"] }

[[bin]]
name = "nxboot"
path = "src/main.rs"
test = false
bench = false
doctest = false
