#
# CONTEXT: The many-apps lane's choreography (TASK-0352, ADR-0093): the apps' number is bounded
# by memory alone. Log in, open the launcher, press its settings button forty times — every press
# a new instance (the launcher launches; only the dock and the taskbar activate a running app).
# The first 28 presses wait for their window (the app's first frame on its re-created surface);
# the rest are acknowledged by the lifecycle authority's answer alone — a launch
# (`abilitymgr: launch (app=settings`) or, while its instance table is still a 32-row constant,
# a refusal by name (`abilitymgr: launch refused (app=settings`). The profile's wait decides which
# the lane demands: P0 the refusal (today's ceiling, measured), P1 forty launches and no refusal.
# Every step waits for what it caused; the declared `settle_s` pauses are the frames that have none.
# OWNERS: @ui @runtime
# STATUS: Functional
# API_STABILITY: Unstable

[scenario]
profile = "many-apps"
start_after = "SELFTEST: input window open"

# The keyboard's first input after boot, acknowledged on its own (see usb-visible.toml).
[[step]]
name = "the keyboard reaches the greeter"
do = { key = "a" }
expect = ["inputd: live keyboard route on"]
timeout_s = 10
retry = 2

[[step]]
name = "log in"
do = { login = true }
expect = ["windowd: session shell visible"]
timeout_s = 60

[[step]]
name = "open the launcher"
do = { click = "launcher_button" }

# Each press is acknowledged by the authority's answer; if none follows (the sheet closed), the
# sheet opens and the button is pressed again. The launcher's sheet is shell glass above every
# window, so its button stays pressable while the windows pile up under it.

[[step]]
name = "launch app 1"
settle_s = 1.0
do = { click = "launch_settings" }
expect = ["abilitymgr: launch (app=settings"]
timeout_s = 20
retry = 1
retry_with = [{ click = "launcher_button" }, { click = "launch_settings" }]

[[step]]
name = "window 1 drawn"
do = { wait = true }
expect = ["apphost: ux launch ", "apphost: resized"]
then = ["WINDOWD: surface presented id="]
timeout_s = 120

