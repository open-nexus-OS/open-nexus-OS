# The twelfth window's first frame left with the eleven before it: one frame, twelve windows, each
# drawn from its own buffer.
[[step]]
name = "twelve windows drawn"
do = { wait = true }
expect = ["windowd: windows drawn (n=12)"]
timeout_s = 30

# -- an occluded window costs the frame nothing (TASK-0351 P1) --------------------------------------
# The focused window (the twelfth) fills the work area: its opaque body covers the eleven below it
# but for its four corner squares, and every window whose body and shadow lie under it is left out
# of the frame (`windowd: windows occluded (n=`; the model in windowd's `surface_presentation.rs`
# pins the count for this cascade). Returned to its place, all twelve are drawn again. This lane
# composes on the CPU, where a glass body is blended and hides nothing: `windows occluded` is the
# GPU path's line (virgl, the board), not expected here.
[[step]]
name = "fill the work area with the last window"
settle_s = 1.0
do = { chord = ["ctrl", "meta_l", "up"] }
expect = ["windowd: wm chord (zone=fill"]
timeout_s = 20

[[step]]
name = "return the last window to its place"
settle_s = 1.0
do = { chord = ["ctrl", "meta_l", "down"] }
expect = ["windowd: wm chord (zone=return"]
timeout_s = 20

# -- a frozen app (TASK-0348 P13, RFC-0111 §4, ADR-0083) ---------------------------------------------
# The focused window (the twelfth) is hidden by the minimize chord; hidden past its grace, its app
# is frozen. It cannot read the compositor's notice frozen — the new compositor's start thaws it.
[[step]]
name = "hide the last window"
settle_s = 1.0
do = { chord = ["ctrl", "meta_l", "m"] }
expect = ["windowd: wm chord (zone=minimize"]
timeout_s = 20

[[step]]
name = "the hidden app freezes"
do = { wait = true }
expect = ["abilitymgr: suspend (inst="]
timeout_s = 30

# -- the compositor's restart (TASK-0348 Phase 6, RFC-0112) -----------------------------------------
# The chord ends the compositor; init respawns it and re-pins every leg into it; execd tells every
# app; the shell is asked for again and kept (no second desktop) — the pointer's wait ring ends on
# that answer (P12), never by its failsafe; and every window comes back from its own app, the
# frozen one thawed first (`thawed=1`) — one frame of the new compositor draws all twelve again.
# No window is launched anew.
[[step]]
name = "restart the compositor"
settle_s = 1.0
do = { chord = ["ctrl", "meta_l", "shift", "backspace"] }
expect = [
  "windowd: restart requested (chord)",
  "init: windowd re-pinned (clients=0x",
  "execd: compositor back (apps=",
]
timeout_s = 90

[[step]]
name = "the apps rejoin"
do = { wait = true }
expect = [
  "gpud: compositor restarted (owners=",
  "gpud: surfaces adopted (n=",
  "windowd: restarted (ghosts=",
  "execd: apps alive told (n=",
  "windowd: ghosts swept (closed=",
  "windowd: ghost taken over (slot=",
  "abilitymgr: compositor up (thawed=1)",
  "abilitymgr: launch kept (app=desktop-shell",
  "windowd: wait ring ended (by=kept)",
  "APPHOST: compositor back (reattached)",
  "apphost: surface re-created",
]
timeout_s = 120

[[step]]
name = "twelve windows back"
do = { wait = true }
expect = ["windowd: windows drawn (n=12)"]
timeout_s = 240

# The desktop itself is back: the new compositor revealed it with the shell's own frame (the
# reveal waits for the session's desktop surface — a shell that never drew leaves it unrevealed).
[[step]]
name = "the shell back"
do = { wait = true }
expect = ["windowd: desktop revealed (seq="]
timeout_s = 120

# -- asked for again and again (TASK-0348 P11) ------------------------------------------------------
# A requested restart is no crash: init respawns the compositor at once every time and counts none
# of them toward its crash window — five inside a minute, and the desktop comes back each time.
[[step]]
name = "restart again (2)"
settle_s = 1.0
do = { chord = ["ctrl", "meta_l", "shift", "backspace"] }
expect = [
  "windowd: restart requested (chord)",
  "init: service restarted name=windowd",
  "windowd: desktop revealed (seq=",
]
timeout_s = 120

[[step]]
name = "restart again (3)"
settle_s = 1.0
do = { chord = ["ctrl", "meta_l", "shift", "backspace"] }
expect = [
