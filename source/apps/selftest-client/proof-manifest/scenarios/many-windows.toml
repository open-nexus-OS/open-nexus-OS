do = { wait = true }
expect = ["windowd: windows drawn (n=12)"]
timeout_s = 240

# -- a field on the fifth compositor (TASK-0348 P14) ------------------------------------------------
# Its surface ids are seeded with the milliseconds since boot — far past 65535 now; the shell's
# search field takes focus and the caret is drawn for a surface named by such an id.
[[step]]
name = "a field takes focus after the restarts"
settle_s = 1.5
do = { click = "search_pill" }
expect = ["apphost: modal open (depth=1)", "apphost: text focus set", "windowd: caret layer on"]
timeout_s = 40
