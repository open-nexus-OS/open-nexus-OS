# CONTEXT: The many-windows lane's choreography (TASK-0348, RFC-0114 §7): the compositor's tables
# grow with the windows. Log in, open the launcher, press its settings button twelve times — every
# press is a new instance with a window of its own (the launcher launches; only the dock and the
# taskbar activate a running app) — and wait for one frame that drew all twelve from their own
# buffers (`windowd: windows drawn (n=12)`). Before RFC-0114 the fifth window was refused
# (`surface create FAIL (window slots exhausted)`) and a ninth app's channel evicted a live one.
# Then one app is hidden and frozen (TASK-0348 P13), the compositor restarts over the twelve
# (RFC-0112, Phase 6) and every window comes back — the frozen one thawed; the restart is asked for
# four more times (P11: a requested restart is never a crash), and a field takes focus on the
# last compositor (P14: its surface ids are far past 65535 by then).
# Every step waits for what it caused; the declared `settle_s` pauses are the frames that have none.
# OWNERS: @ui @runtime
# STATUS: Functional
# API_STABILITY: Unstable

[scenario]
profile = "many-windows"
start_after = "SELFTEST: input window open"

# The keyboard's first input after boot, acknowledged on its own (see usb-visible.toml).
[[step]]
name = "the keyboard reaches the greeter"
do = { key = "a" }
expect = ["inputd: live keyboard route on"]
timeout_s = 10
retry = 2

[[step]]
name = "log in"
do = { login = true }
expect = ["windowd: session shell visible"]
timeout_s = 60

[[step]]
name = "open the launcher"
do = { click = "launcher_button" }

# Each press is acknowledged by the launch alone; if none follows (the sheet closed), the sheet
# opens and the button is pressed again. The launcher's sheet is shell glass above every window,
# so its button stays pressable while the windows pile up under it.
# The window then comes up on its own and its step ends on its first frame (app-host's launch
# line: the one surface is laid out for its store when it is created, TASK-0354 P2). A window that
# never comes up fails its own step by name: it is never pressed for again.

[[step]]
name = "launch window 1"
settle_s = 1.0
do = { click = "launch_settings" }
expect = ["abilitymgr: launch (app=settings"]
timeout_s = 20
retry = 1
retry_with = [{ click = "launcher_button" }, { click = "launch_settings" }]

[[step]]
name = "window 1 drawn"
do = { wait = true }
expect = ["apphost: ux launch "]
timeout_s = 120

