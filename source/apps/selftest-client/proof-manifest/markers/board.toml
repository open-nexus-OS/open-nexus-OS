#
# CONTEXT: The board's own vocabulary (TASK-0327B P4 H0c): what the loader and the kernel say
# only on hardware (the tree names a LED, an APMU, harts the OS may not start), the storage
# owner's lines the board ladder requires, the display lines Block 1's gate requires, and the
# operator-acked markers `board-visual: <name>` that `scripts/board-ack.sh` refuses to append
# unless declared here. The REQUIRED ladder lives in `scripts/board-test.sh`; this file is the
# vocabulary `verify-uart` judges surprise against.
# OWNERS: @runtime @tools-team
# STATUS: Functional
# API_STABILITY: Stable (marker literals are contracts)

[marker."nxboot: boot led ok (gpio="]
phase = "bringup"
proves = "TASK-0260B P3: the loader brought the LED's GPIO block up from the tree, muxed the pad and lit the ladder's first group"

[marker."nxboot: boot led none ("]
phase = "bringup"

[marker."nxboot: watchdog off ("]
phase = "bringup"
proves = "TASK-0260B P3: the SoC watchdog the tree names was read and left disabled (the value it had is in the line)"

[marker."nxboot: cores awake (apmu="]
phase = "bringup"
proves = "TASK-0260B P3: every core's power-down-on-wfi bits are clear before the kernel runs (mainline firmware's cold-boot contract)"

[marker."nxboot: dram probe "]
phase = "bringup"
proves = "RFC-0107 Phase 3: whether the previous boot's DRAM survived the reset (kept | lost | stale | none)"

[marker."nxboot: disk sdhci mode="]
phase = "bringup"
proves = "TASK-0327B P4 H0a: the mode and bus width the loader reads the boot disk with, next to its slot verdict"

[marker."KINIT: milestone "]
phase = "bringup"
proves = "TASK-0260B P3: each LED milestone with the boot's own clock and the console's UART stall count"

[marker."KINIT: boot led ladder on ("]
phase = "bringup"
proves = "the tree asked for the DEPRECATED slow LED ladder (`/chosen/nexus,boot-led-ladder`, a diagnostic image only): ~22 s of pulse groups; without it the LED only marks kernel coming up / runtime running"

[marker."KINIT: irq state before runtime"]
phase = "bringup"
proves = "TASK-0260B P3: the interrupt state the runtime begins with (sstatus, sie, sip)"

[marker."disabled by the tree — not started"]
phase = "bringup"
proves = "RFC-0098: a cpu node with status = disabled is never started (`KINIT: hart<n> disabled by the tree — not started`)"

[marker."init: net plane none ("]
phase = "bringup"
proves = "RFC-0098: the tree names no network device; the plane is declared absent, never fatal"

[marker."init: rng plane none ("]
phase = "bringup"

[marker."init: gpu plane none ("]
phase = "bringup"

[marker."KGATE: smp bringup ok mask="]
phase = "bringup"
proves = "every hart the tree enables came online through SBI HSM (mask=0xf on the board's four, 0x1 on QEMU smp1)"

[marker."KSELFTEST: spawn ok pid="]
phase = "bringup"
proves = "init exists as a task: its image copied into its address space and spawned by the kernel"

[marker."blkd: ready"]
phase = "bringup"

[marker."blkd: backend ok (kind="]
phase = "bringup"
proves = "TASK-0246: the block owner opened the tree's boot disk — on the board the SDHCI host with the card's negotiated mode and bus width"

[marker."blkd: gpt ok (parts="]
phase = "bringup"

[marker."bundlemgrd: system volume verified ("]
phase = "bringup"
proves = "the system volume's bundle set verified from the boot disk before any bundle is served"

[marker."SELFTEST: soc glue display ok"]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0245B P3 (D3): socd brought up every display node the tree names — power domain 7 reported on in its status word, hdmi_reset released, hmclk gated on at the 491.52 MHz the nodes demand; socd's own line carries every register it touched, before and after"

[marker."SELFTEST: soc glue display FAIL (status=0x"]
phase = "bringup"
emit_when = { profile = "board-headless" }

[marker."SELFTEST: soc glue display FAIL (no display node)"]
phase = "bringup"
emit_when = { profile = "board-headless" }

[marker."SELFTEST: soc glue display FAIL (ipc)"]
phase = "bringup"
emit_when = { profile = "board-headless" }

[marker."init: display plane ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2: the tree names a display controller and its encoder, and policyd let init grant both windows to gpud (device.mmio.display)"

[marker."gpud: dc glue ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2: socd brought the controller's and the encoder's nodes up at gpud's request (RFC-0106) before gpud touched a register"

[marker."gpud: dc controller ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2: the controller's window maps and answers with the version the register map was measured on"

[marker."gpud: dc encoder ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a: the encoder ran its measured sequence for the mode's pixel clock and its PLL locked; the line names the monitor's hot-plug"

[marker."gpud: dc encoder ok (hpd=1"]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a: with the encoder's four pads muxed (socd, `hdmi_0_grp` as measured live), the encoder sees the monitor's hot-plug — the condition the boot loader's own display probe waits for"

[marker."gpud: dc readback ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a: every controller word the bring-up wrote reads back (observed before it becomes a rung: a shadowed word that latches at the frame boundary would read otherwise)"

[marker."gpud: dc readback differs ("]
phase = "bringup"
emit_when = { profile = "board-headless" }

[marker."gpud: dc scanout ok ("]
phase = "bringup"
proves = "TASK-0251 P2a: the controller scans the boot splash's plane — a contiguous block made for it — at the mode named in the line, by either witness (the output line counter moved, the raw vsync raised); `cea` = a standard timing, `edid` = the monitor's own (the Block 1 gate requires the EDID form with windowd's desktop)"

[marker."gpud: FAIL dc "]
phase = "bringup"
emit_when = { profile = "board-headless" }

[marker."gpud: dc framebuffer refused ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a step 2: the display did not come up, so gpud refuses windowd's framebuffer by name and windowd runs display-less (never a grant of a framebuffer nothing scans)"

[marker."gpud: dc first present ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a step 2: the cost of windowd's first present on the board's harts — the CPU executor's run over the framebuffer and the cache clean of its damage (a measurement, printed once; the stats window needs 120 presents)"

[marker."gpud: dc reveal flip ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a step 2 (RFC-0093 §5): on the first present after windowd's reveal the whole display plane was cleaned and the controller switched from the boot splash to windowd's framebuffer — the plane's words read back; the line records whether the controller cleared config-ready (the latch, observed)"

[marker."board-visual: splash"]
phase = "end"
proves = "a person at the monitor confirmed gpud's boot splash on THIS boot's HDMI output (TASK-0251 P2a first light)"

[marker."windowd: desktop revealed"]
phase = "bringup"

[marker."board-visual: desktop"]
phase = "end"
proves = "a person at the monitor confirmed the desktop of THIS boot (scripts/board-ack.sh; Block 1 gate)"

[marker."board-visual: typed"]
phase = "end"
proves = "a person confirmed that a USB keyboard and mouse move THIS boot's desktop (Block 2 gate)"
