#
# CONTEXT: The board's own vocabulary (TASK-0327B P4 H0c): what the loader and the kernel say
# only on hardware (the tree names a LED, an APMU, harts the OS may not start), the storage
# owner's lines the board ladder requires, the display lines Block 1's gate requires, and the
# operator-acked markers `board-visual: <name>` that `scripts/board-ack.sh` refuses to append
# unless declared here. The REQUIRED ladder lives in `scripts/board-test.sh`; this file is the
# vocabulary `verify-uart` judges surprise against.
# OWNERS: @runtime @tools-team
# STATUS: Functional
# API_STABILITY: Stable (marker literals are contracts)

[marker."nxboot: boot led ok (gpio="]
phase = "bringup"
proves = "TASK-0260B P3: the loader brought the LED's GPIO block up from the tree, muxed the pad and lit the ladder's first group"

[marker."nxboot: boot led none ("]
phase = "bringup"

[marker."nxboot: watchdog off ("]
phase = "bringup"
proves = "TASK-0260B P3: the SoC watchdog the tree names was read and left disabled (the value it had is in the line)"

[marker."nxboot: cores awake (apmu="]
phase = "bringup"
proves = "TASK-0260B P3: every core's power-down-on-wfi bits are clear before the kernel runs (mainline firmware's cold-boot contract)"

[marker."nxboot: dram probe "]
phase = "bringup"
proves = "RFC-0107 Phase 3: whether the previous boot's DRAM survived the reset (kept | lost | stale | none)"

[marker."nxboot: disk sdhci mode="]
phase = "bringup"
proves = "TASK-0327B P4 H0a: the mode and bus width the loader reads the boot disk with, next to its slot verdict"

[marker."KINIT: milestone "]
phase = "bringup"
proves = "TASK-0260B P3: each LED milestone with the boot's own clock and the console's UART stall count"

[marker."KINIT: boot led ladder on ("]
phase = "bringup"
proves = "the tree asked for the DEPRECATED slow LED ladder (`/chosen/nexus,boot-led-ladder`, a diagnostic image only): ~22 s of pulse groups; without it the LED only marks kernel coming up / runtime running"

[marker."KINIT: irq state before runtime"]
phase = "bringup"
proves = "TASK-0260B P3: the interrupt state the runtime begins with (sstatus, sie, sip)"

[marker."disabled by the tree — not started"]
phase = "bringup"
proves = "RFC-0098: a cpu node with status = disabled is never started (`KINIT: hart<n> disabled by the tree — not started`)"

[marker."init: net plane none ("]
phase = "bringup"
proves = "RFC-0098: the tree names no network device; the plane is declared absent, never fatal"

[marker."init: rng plane none ("]
phase = "bringup"

[marker."init: gpu plane none ("]
phase = "bringup"

[marker."KGATE: smp bringup ok mask="]
phase = "bringup"
proves = "every hart the tree enables came online through SBI HSM (mask=0xf on the board's four, 0x1 on QEMU smp1)"

[marker."KSELFTEST: spawn ok pid="]
phase = "bringup"
proves = "init exists as a task: its image copied into its address space and spawned by the kernel"

[marker."blkd: ready"]
phase = "bringup"

[marker."blkd: backend ok (kind="]
phase = "bringup"
proves = "TASK-0246: the block owner opened the tree's boot disk — on the board the SDHCI host with the card's negotiated mode and bus width"

[marker."blkd: gpt ok (parts="]
phase = "bringup"

[marker."bundlemgrd: system volume verified ("]
phase = "bringup"
proves = "the system volume's bundle set verified from the boot disk before any bundle is served"

[marker."SELFTEST: soc glue display ok"]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0245B P3 (D3): socd brought up every display node the tree names — power domain 7 reported on in its status word, hdmi_reset released, hmclk gated on at the 491.52 MHz the nodes demand; socd's own line carries every register it touched, before and after"

[marker."SELFTEST: soc glue display FAIL (status=0x"]
phase = "bringup"
emit_when = { profile = "board-headless" }

[marker."SELFTEST: soc glue display FAIL (no display node)"]
phase = "bringup"
emit_when = { profile = "board-headless" }

[marker."SELFTEST: soc glue display FAIL (ipc)"]
phase = "bringup"
emit_when = { profile = "board-headless" }

[marker."init: display plane ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2: the tree names a display controller and its encoder, and policyd let init grant both windows to gpud (device.mmio.display)"

[marker."gpud: dc glue ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2: socd brought the controller's and the encoder's nodes up at gpud's request (RFC-0106) before gpud touched a register"

[marker."gpud: dc controller ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2: the controller's window maps and answers with the version the register map was measured on"

[marker."gpud: dc encoder ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a: the encoder ran its measured sequence for the mode's pixel clock and its PLL locked; the line names the monitor's hot-plug"

[marker."gpud: dc encoder ok (hpd=1"]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a: with the encoder's four pads muxed (socd, `hdmi_0_grp` as measured live), the encoder sees the monitor's hot-plug — the condition the boot loader's own display probe waits for"

[marker."gpud: dc readback ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a: every controller word the bring-up wrote reads back (observed before it becomes a rung: a shadowed word that latches at the frame boundary would read otherwise)"

[marker."gpud: dc readback differs ("]
phase = "bringup"
emit_when = { profile = "board-headless" }

[marker."gpud: dc scanout ok ("]
phase = "bringup"
proves = "TASK-0251 P2a: the controller scans the boot splash's plane — a contiguous block made for it — at the mode named in the line, by either witness (the output line counter moved, the raw vsync raised); `cea` = a standard timing, `edid` = the monitor's own (the Block 1 gate requires the EDID form with windowd's desktop)"

[marker."gpud: FAIL dc "]
phase = "bringup"
emit_when = { profile = "board-headless" }

[marker."gpud: dc framebuffer refused ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a step 2: the display did not come up, so gpud refuses windowd's framebuffer by name and windowd runs display-less (never a grant of a framebuffer nothing scans)"

[marker."gpud: dc first present ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a step 2: the cost of windowd's first present on the board's harts — the CPU executor's run over the framebuffer and the cache clean of its damage (a measurement, printed once; the stats window needs 120 presents)"

[marker."gpud: dc reveal flip ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0251 P2a step 2 (RFC-0093 §5): on the first present after windowd's reveal the whole display plane was cleaned and the controller switched from the boot splash to windowd's framebuffer — the plane's words read back; the line records whether the controller cleared config-ready (the latch, observed)"

[marker."board-visual: splash"]
phase = "end"
proves = "a person at the monitor confirmed gpud's boot splash on THIS boot's HDMI output (TASK-0251 P2a first light)"

[marker."windowd: desktop revealed"]
phase = "bringup"

[marker."board-visual: desktop"]
phase = "end"
proves = "a person at the monitor confirmed the desktop of THIS boot (scripts/board-ack.sh; Block 1 gate)"

[marker."board-visual: typed"]
phase = "end"
proves = "a person confirmed that a USB keyboard and mouse move THIS boot's desktop (Block 2 gate)"

[marker."board-visual: pointer"]
phase = "end"
proves = "a person confirmed that the arrow follows the mouse at once on THIS boot (the pointer is the controller's layer, no present per move — TASK-0251 P2a step 3c)"

[marker."board-visual: tile"]
phase = "end"
proves = "a person confirmed on THIS boot that a window tiles by dragging it to an edge/corner, that Super+Ctrl+←/→ and ↓ tile and return it, and that the app-icon menu's glyph rows do the same (TASK-0066 — the desktop default tiling model)"

[marker."board-visual: clipboard"]
phase = "end"
proves = "a person confirmed on THIS boot that the top bar's magnifier opens the search field with the Apps, Files and Clipboard buttons, that Apps filters by the typed text, that Clipboard shows the history as cards and a pressed card moves to the top, and that text selected with Ctrl+A or Shift+arrows and copied with Ctrl+C appears in the open history at once and pastes back with Ctrl+V (TASK-0067B — the clipboard's desktop surface and the keyboard editing core)"

[marker."board-visual: modal"]
phase = "end"
proves = "a person confirmed on THIS boot that the Control Center's power button opens the shutdown alert over a scrim, that ESC and Cancel close it, and that Confirm answers with the system toast at the left edge which leaves by itself (TASK-0074 — the shell's first modal, every visual task ships such a rung)"

# --- TASK-0251 P2a step 3c: the pointer is a layer of the display controller ------------------

[marker."gpud: dc cursor layer ok ("]
phase = "bringup"
proves = "TASK-0251 P2a step 3c: windowd's pointer sprite laid into the controller's pointer block (64x64 ARGB8888), the pointer channel and composer layer programmed as measured on the stock system (channel 2, layer 6, blend mode 5), every word read back — the display answered CURSOR_REPLY_HW"
emit_when = { profile = "board-headless" }

[marker."gpud: FAIL dc cursor layer ("]
phase = "bringup"
proves = "the pointer layer could not be armed (no block, a sprite that does not fit, a word that did not read back): no software pointer stands in — the lane fails"
forbidden_when = { profile = ["board-headless", "board-visible"] }

[marker."gpud: dc refused BlendCursor"]
phase = "bringup"
proves = "a present on the controller path carried a software-blended pointer: the second implementation the pointer layer replaced — refused, never drawn"
forbidden_when = { profile = ["board-headless", "board-visible"] }

[marker."windowd: hw cursor on"]
phase = "bringup"
proves = "windowd runs the pointer on the display's overlay (OP_MOVE_CURSOR per move, no software BlendCursor in its presents)"
emit_when = { profile = "board-headless" }

# --- TASK-0328 U3: USB on the board (RFC-0099 Phase 3, RFC-0106 amended) ----------------------

[marker."socd: bring-up /soc/storage-bus/usb@c0a00000 ok ("]
phase = "bringup"
proves = "TASK-0328 U3 (RFC-0106): the host node's three resets released, its clock on and the APMU glue word at 0x3c8 as the stock system runs it (0x0b008000), every write read back — `writes=` says what our loader had left undone"
emit_when = { profile = "board-headless" }

[marker."socd: bring-up /soc/storage-bus/phy@c0a30000 ok ("]
phase = "bringup"
proves = "TASK-0328 U3 (RFC-0106): the USB 2.0 PHY's clock on and the PMU word it takes its clock control from as the stock system runs it (0x007d0018), read back"
emit_when = { profile = "board-headless" }

[marker."socd: bring-up /soc/storage-bus/phy@c0b10000 ok ("]
phase = "bringup"
proves = "TASK-0328 U3 (RFC-0106, board cycle 10): the SuperSpeed PHY's global reset released (PCIe port A's, bit 8 of 0x3cc, SET = held — the one APMU reset of inverted polarity), the port's hold-PHY-reset bit cleared and the lane select on USB, read back, before xhcid runs its PLL sequence"
emit_when = { profile = "board-headless" }

[marker."socd: bring-up /usb-hub ok ("]
phase = "bringup"
proves = "TASK-0328 U3 (RFC-0106 amended): the on-board hub's pads on the GPIO function, its two lines and VBUS driven high as outputs (read back), the measured 200 ms VBUS delay spent on socd's one-shot"
emit_when = { profile = "board-headless" }

# The board's input proof is inputd's own word (TASK-0253B P4 / TASK-0328 U3, Block 2's gate):
# the markers it emits the moment a real event reaches its live routes. A selftest-client probe
# that polled windowd's visible state for them was retired in cycle 16 — the topology declares
# no selftest-client → windowd route (`route_matches` test), so it could never observe anything.
[marker."inputd: live pointer route on"]
phase = "end"
proves = "a real pointer event from the operator's USB mouse — over xhcid and hidrawd's USB source — reached inputd's live pointer route (the board's input proof, with the operator's `board-visual: typed` / `pointer` acks)"

[marker."inputd: live keyboard route on"]
phase = "end"
proves = "a real key from the operator's USB keyboard reached inputd's live keyboard route"

# The board's USB values as measured on the stock system (2026-10-04) and modelled in xhcid's
# host tests (`tests/xhci/enumerate.rs`, the board rig): the ladder's exact rungs. Each is a
# full form of a prefix marker declared in `usb.toml` (the mirror check wants the rung's
# literal declared whole).

[marker."xhcid: controller ok (version=1.10 ports=2 slots=64 csz=64 scratch=1 irq=125)"]
phase = "bringup"
proves = "TASK-0328 U3: the board's xHCI as measured — version 1.10, two root ports (USB 2.0 and 3.0), 64 slots, 64-byte contexts, one scratchpad buffer, line 125 from the tree"
emit_when = { profile = "board-headless" }

[marker."xhcid: hub (slot=1 port=1 speed=high ports=5 ttt=3)"]
phase = "bringup"
proves = "TASK-0328 U3: the on-board high-speed hub on the USB 2.0 root port, its five ports powered, its TT think time programmed into its slot (RFC-0099 §4)"
emit_when = { profile = "board-headless" }

# The rungs anchor on the device's identity: the slot and route depend on the order the hub's
# ports answered in (cycle 10 enumerated the receiver before the keyboard), so they trail the
# line and the rung stops before them.
[marker."xhcid: device enumerated (vid=3434 pid=0123 class=3 speed=full"]
phase = "bringup"
proves = "TASK-0328 U3: the desk's keyboard, full speed behind the hub, addressed through the hub's TT"
emit_when = { profile = "board-headless" }

[marker."xhcid: hid boot interface (vid=3434 pid=0123 role=keyboard if=0 ep=0x81 mps=8 interval=1"]
phase = "bringup"
proves = "TASK-0328 U3: the keyboard's boot interface in the boot protocol, its interrupt pipe running at 1 ms"
emit_when = { profile = "board-headless" }

[marker."xhcid: device enumerated (vid=046d pid=c53f class=3 speed=full"]
phase = "bringup"
proves = "TASK-0328 U3: the mouse's radio receiver, full speed behind the hub, addressed through the hub's TT"
emit_when = { profile = "board-headless" }

[marker."xhcid: hid boot interface (vid=046d pid=c53f role=mouse if=1 ep=0x82 mps=32 interval=1"]
phase = "bringup"
proves = "TASK-0328 U3: the receiver's mouse interface in the boot protocol (its SET_IDLE STALL recovered), its pipe running at 1 ms"
emit_when = { profile = "board-headless" }

[marker."hidrawd: usb hid device (vid=3434 pid=0123 role=keyboard)"]
phase = "bringup"
proves = "TASK-0253B P4: hidrawd registered the desk's keyboard from xhcid's attach"
emit_when = { profile = "board-headless" }

[marker."hidrawd: usb hid device (vid=046d pid=c53f role=mouse)"]
phase = "bringup"
proves = "TASK-0253B P4: hidrawd registered the receiver's mouse interface from xhcid's attach"
emit_when = { profile = "board-headless" }

[marker."xhcid: ready (ports=2 connected="]
phase = "bringup"
proves = "TASK-0328 U3: both root ports powered and scanned; the connected count is the cycle's own (the hub on the USB 2.0 port; whether the SuperSpeed twin links is left alone in v1)"
emit_when = { profile = "board-headless" }

[marker."socd: apmu vs stock ("]
phase = "bringup"
proves = "a measurement (TASK-0328 U3): every APMU word of the stock dump that reads unlike it after our loader, `off:ours/stock` — where a block our tables do not cover stays gated"
emit_when = { profile = "board-headless" }

[marker."socd: mpmu vs stock ("]
phase = "bringup"
proves = "a measurement (TASK-0328 U3): every MPMU word of the stock dump that reads unlike it after our loader"
emit_when = { profile = "board-headless" }
