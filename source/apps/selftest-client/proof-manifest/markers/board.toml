# TASK-0329 G1 (RFC-0101 Phase 2 / §8b): the board GPU online — each rung a line the first
# board cycle is judged from; `gpud: FAIL gpu ` is the FAIL form of every rung.
[marker."gpud: gpu glue ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0329 G1: socd brought the GPU node up at gpud's request (domain 2 by its software sequence, gpu_clk, the reset after the clock) before gpud touched a register"

[marker."gpud: gpu core ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0329 G1: the GPU's window maps and the core id register reads the measured id (the domain, clock and reset are really up)"

[marker."gpud: gpu fw ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0329 G1: the published firmware, placed by its documented layout and started by the open sequence, set firmware_started and executed the first kernel command (its return slot seen through the cache maintenance); the line carries the boot time and the interrupt counts (ours and the firmware's)"

[marker."gpud: gpu mmu ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0329 G1: one GPU address space (a page catalogue the firmware memory context names), a page bound and unbound through the host-tested encoder, the firmware's MMU-cache flush acknowledged in its return slot after each"

[marker."gpud: gpu fence ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0329 G1: a null job (one timeline UPDATE in a transfer context's client buffer, one kick) completed sixty-four times: the firmware wrote the word, the interrupt fired, gpud signalled the kernel timeline fence — the fence bridge; rt_us is the frame's fixed cost on our side against the stock 640 us"

# TASK-0169B (RFC-0101 Phase 3 / §8c): the GPU draws — the open driver's two transfer jobs for
# this core, captured on the host as the scene bundle, replayed through `GfxDevice` into a plane
# of the ring; `gpud: FAIL gpu quad (` is the FAIL form of both rungs.
[marker."gpud: gpu fill ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0169B: the bundle's 29 buffers created, filled and bound at their captured addresses, the plane adopted at the target's; the clear (a TQ_3D command plus the timeline UPDATE, one kick) completed and timed — ns_per_px against the stock stack's 1.8"

[marker."gpud: gpu quad ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0169B: the blit (the open driver's PDS/USC programs and texture state at their captured addresses, our generated texture) completed; four sample pixels read back after the cache flush match the background, the texture's white frame and both checker colours; the plane went to the glass"

# TASK-0215 5a (RFC-0101 Phase 4 / §8d): the render queue — the open driver's render pass (geometry,
# partial-render fragment, fragment) replayed into a plane of the ring with the render context,
# the free lists and the dataset built by the device; `gpud: FAIL gpu render (` is its FAIL form.
[marker."gpud: gpu render ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0215 5a: the render context (two queues, the captured context-switch state), two free lists of the device's pages and the render-target dataset accepted by the firmware; the geometry and fragment jobs completed in the kernel's sequence; four sample pixels read back after the cache flush match the clear and the blended textured quad; the plane went to the glass"

# TASK-0215 5c-2 P4d (RFC-0101 §7b): the compositor's pipeline library taken for the context;
# `gpud: FAIL gpu library (` is its FAIL form.
[marker."gpud: gpu library ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0215 5c-2 P4d: resources/gpu/pipelines/compositor.nxgp parsed for this core's code target and features, every entry accepted (its program decoding into instruction groups within its budget, its setup programs the forms the generator writes for its interface), each program placed untouched in the context's code heap and our setup programs (kick, varying iteration, state load) in its setup heap, each kick naming its program"

# TASK-0215 5b (RFC-0101 Phase 4b): dynamic geometry — three quads at positions and tints the
# device chose; the vertex buffer, tints, state-load data, PPP blocks and the stream's per-draw
# records written by the device from the open driver's word layouts, drawn with the library's
# premultiplied layer since 5c-2 P4d; `gpud: FAIL gpu quads (` is its FAIL form.
[marker."gpud: gpu quads ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0215 5b: the device emitted the per-draw state of three quads itself (the library pipeline's setup programs placed once and shared, the index offset into one vertex buffer), rebound the target at a fresh plane, kicked the captured jobs, and each quad's centre read back as texel x tint as a premultiplied source over the clear"

# TASK-0215 5c-1 (RFC-0101 §8d): a pass limited to its quad's area — the back end's clip, the
# region clip, no background on empty tiles — draws the quad and leaves the rest of the plane
# as it was; `gpud: FAIL gpu area (` is its FAIL form.
[marker."gpud: gpu area ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0215 5c-1: after a 16x16 pass over the whole plane, two sentinels written by the CPU (one a pixel above the quad in the quad's own tile, one in the plane's first tile) survive the same pass limited to the quad's rectangle, the quad's sample reads texel x tint as a premultiplied source over the clear (the library's premultiplied layer since 5c-2 P4d), and the limited pass costs less than the whole-plane one"

# TASK-0215 5c-2 P3c (ADR-0072): the compositor's layer compiled from WGSL by our own toolchain
# (tools/nxgpu → resources/gpu/pipelines), drawn on the board; `gpud: FAIL gpu pipeline (` is its
# FAIL form.
[marker."gpud: gpu pipeline ok ("]
phase = "bringup"
emit_when = { profile = "board-headless" }
proves = "TASK-0215 5c-2 P3c-P5d: every pipeline of the compositor library (compiled from WGSL by our toolchain, placed by the library rung with our own setup programs and constant blocks) drawn on a pass limited to its quad: the opaque, premultiplied and straight-alpha layers read texel x tint (straight premultiplied by its own alpha) over the clear, the rounded layer reads it in its interior and leaves its corner pixel at the clear, a window's drop shadow is knocked out under the window and shows below it at the shadow formula's alpha; the glass blur's chain over a backdrop the CPU wrote (the horizontal pass into half resolution, the vertical pass with the saturation, the rounded layer sampling the result back, each texture read through our own descriptor) reads the full-resolution gaussian's formula inside the glass within six levels; and the opaque layer costs no more a pixel than the stock stack's opaque textured fill (1.8 ns)"

[marker."gpud: FAIL gpu "]
phase = "bringup"
emit_when = { profile = "board-headless" }

