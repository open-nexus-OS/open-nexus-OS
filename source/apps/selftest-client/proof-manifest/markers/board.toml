proves = "TASK-0328 U3 (RFC-0106): the host node's three resets released, its clock on and the APMU glue word at 0x3c8 as the stock system runs it (0x0b008000), every write read back — `writes=` says what our loader had left undone"
emit_when = { profile = "board-headless" }

[marker."socd: bring-up /soc/storage-bus/phy@c0a30000 ok ("]
phase = "bringup"
proves = "TASK-0328 U3 (RFC-0106): the USB 2.0 PHY's clock on and the PMU word it takes its clock control from as the stock system runs it (0x007d0018), read back"
emit_when = { profile = "board-headless" }

[marker."socd: bring-up /soc/storage-bus/phy@c0b10000 ok ("]
phase = "bringup"
proves = "TASK-0328 U3 (RFC-0106, board cycle 10): the SuperSpeed PHY's global reset released (PCIe port A's, bit 8 of 0x3cc, SET = held — the one APMU reset of inverted polarity), the port's hold-PHY-reset bit cleared and the lane select on USB, read back, before xhcid runs its PLL sequence"
emit_when = { profile = "board-headless" }

[marker."socd: bring-up /usb-hub ok ("]
