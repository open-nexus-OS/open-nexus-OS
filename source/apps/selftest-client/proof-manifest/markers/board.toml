# CONTEXT: The board's own vocabulary (TASK-0327B P4 H0c): what the loader and the kernel say
# only on hardware (the tree names a LED, an APMU, harts the OS may not start), the storage
# owner's lines the board ladder requires, the display lines Block 1's gate requires, and the
# operator-acked markers `board-visual: <name>` that `scripts/board-ack.sh` refuses to append
# unless declared here. The REQUIRED ladder lives in `scripts/board-test.sh`; this file is the
# vocabulary `verify-uart` judges surprise against.
# OWNERS: @runtime @tools-team
# STATUS: Functional
# API_STABILITY: Stable (marker literals are contracts)

