# TASK-0333 6a (RFC-0100 §1): the memory a task leaves behind at exit. The VMO holder child
# creates, maps and touches a 1 MiB VMO and exits holding it; the selftest spawns it ten times
# and reads the kernel's memory record (`mm_stats`) before the loop and after every cycle —
# `SELFTEST: mm loop (cycle= free= vmos= vmo_bytes=)` is the series (a measurement, no verdict);
# the loop is `ok` when the record after the loop holds less than one holder more than before.
[marker."child: vmo holder start"]
phase = "exec"

[marker."SELFTEST: mm loop ("]
phase = "exec"

[marker."SELFTEST: rss loop ok ("]
phase = "exec"
proves = "TASK-0333 6a: ten VMO-holding children exited and no cycle's step of the kernel's record held a tenth of a holder or a kernel object more — what dies is freed (RFC-0100 §1); the smallest step of the ten is judged, so a launch elsewhere during the loop (one step) is not read as a leak (TASK-0340)"

[marker."SELFTEST: rss loop FAIL ("]
phase = "exec"

