# CONTEXT: Markers in phase `exec` (RFC-0014 order = 7).
# Loaded via `[include] markers = "markers/*.toml"` in
# `proof-manifest/manifest.toml`. The parser visits files in
# lexicographic order; within a file, `[marker."…"]` order is preserved
# verbatim.
#
# OWNERS: @runtime
# STATUS: Functional
# API_STABILITY: Stable; literals are the contract surface (referenced as
#                `M_<KEY>` constants from `markers_generated.rs`)

[marker."SELFTEST: ipc routing execd ok"]
phase = "exec"

# P0.2 recv-wake gate: execd spawns `recv-wake-probe` once after ready; the probe
# parks in a blocking recv and execd pings it — this marker proves the kernel
# wakes an exec'd child parked in `Wait::Blocking` (the #102-family regression
# gate). Emitted by execd (os_lite.rs) every boot, so it must be a KNOWN marker
# or `nexus-evidence` rejects the trace (`unknown_marker`).
[marker."SELFTEST: exec child blocking recv wake ok"]
phase = "exec"

# TASK-0049 reanimation (2026-08-19): the exec/exit0/crash/minidump chain
# retired in af0c7a8d ("children LOAD but no longer execute") is restored —
# root cause was execd never resuming suspended-spawned children, fixed in
# 0080D R1 (execd os_lite.rs "#102 ROOT CAUSE FIX"). `child: hello-elf` is
# the marker that proves an exec'd child EXECUTES (the parent-side markers
# below are emitted unconditionally after a yield window).
[marker."child: hello-elf"]
phase = "exec"

[marker."execd: elf load ok"]
phase = "exec"

[marker."SELFTEST: e2e exec-elf ok"]
phase = "exec"

[marker."child: exit0 start"]
phase = "exec"

# ADR-0056 exit-reason truth (TASK-0049 step 2): the kernel records WHY a
# task died and `wait` delivers it. `execd: exit pid=` is the per-child
# truth line (prefix marker; `reason=<label> code=<c>` follows); the
# selftest asserts clean-on-exit0 and fault-on-VA0-deref.
[marker."execd: exit pid="]
phase = "exec"

[marker."child: fault start"]
phase = "exec"

[marker."SELFTEST: exit reason ok"]
phase = "exec"

[marker."SELFTEST: exit reason FAIL"]
phase = "exec"

[marker."execd: child exited"]
phase = "exec"

[marker."SELFTEST: child exit ok"]
phase = "exec"

[marker."child: minidump start"]
phase = "exec"

[marker."execd: crash report pid="]
