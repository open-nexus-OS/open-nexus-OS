# root cause was execd never resuming suspended-spawned children, fixed in
# 0080D R1 (execd os_lite.rs "#102 ROOT CAUSE FIX"). `child: hello-elf` is
# the marker that proves an exec'd child EXECUTES (the parent-side markers
# below are emitted unconditionally after a yield window).
[marker."child: hello-elf"]
phase = "exec"

[marker."execd: elf load ok"]
phase = "exec"

[marker."SELFTEST: e2e exec-elf ok"]
phase = "exec"

[marker."child: exit0 start"]
