#
# CONTEXT: Markers in phase `policy` (RFC-0014 order = 6).
# Loaded via `[include] markers = "markers/*.toml"` in
# `proof-manifest/manifest.toml`. The parser visits files in
# lexicographic order; within a file, `[marker."…"]` order is preserved
# verbatim.
#
# OWNERS: @runtime
# STATUS: Functional
# API_STABILITY: Stable; literals are the contract surface (referenced as
#                `M_<KEY>` constants from `markers_generated.rs`)

[marker."SELFTEST: policy allow ok"]
phase = "policy"

[marker."SELFTEST: policy deny ok"]
phase = "policy"

[marker."bundlemgrd: sign policy allow ok"]
phase = "policy"
emit_when = { profile = "supply-chain" }

[marker."bundlemgrd: sign policy deny ok"]
phase = "policy"
emit_when = { profile = "supply-chain" }

[marker."SELFTEST: sign policy allow ok"]
phase = "policy"
emit_when = { profile = "supply-chain" }

[marker."SELFTEST: sign policy deny ok"]
phase = "policy"
emit_when = { profile = "supply-chain" }

[marker."SELFTEST: sign policy unknown publisher rejected ok"]
phase = "policy"
emit_when = { profile = "supply-chain" }

[marker."SELFTEST: sign policy unknown key rejected ok"]
phase = "policy"
emit_when = { profile = "supply-chain" }

[marker."SELFTEST: sign policy payload tamper rejected ok"]
phase = "policy"
emit_when = { profile = "supply-chain" }

[marker."abi-filter: deny (subject=selftest-client syscall=statefs.put)"]
phase = "policy"
proves = "abi-filter deny audit line emitted"

[marker."SELFTEST: abi filter deny ok"]
phase = "policy"

[marker."SELFTEST: abi filter allow ok"]
phase = "policy"

[marker."abi-filter: deny (subject=selftest-client syscall=net.bind)"]
phase = "policy"

[marker."SELFTEST: abi netbind deny ok"]
phase = "policy"

[marker."SELFTEST: abi stale epoch reject ok"]
phase = "policy"
proves = "OP_SET_ABI_MODE against the previous epoch is refused STATUS_STALE (RFC-0091 §4)"

[marker."SELFTEST: abi enforce allow ok"]
phase = "policy"
proves = "statefsd put under the allowed prefix passed the policyd argument filter (OP_ABI_EVAL)"

[marker."SELFTEST: abi enforce deny ok"]
phase = "policy"
proves = "statefsd put under the narrower deny prefix was refused STATUS_ACCESS_DENIED by the seam"

[marker."SELFTEST: abi learn collected ok"]
phase = "policy"
proves = "in Learn mode the refusal was admitted by policyd's learn collector (OP_ABI_LEARN_STATS admitted +1; Enforce refusal +0)"

[marker."SELFTEST: abi learn delivered ok"]
phase = "policy"
proves = "the learn record reached logd (append acked or query hit) — best-effort by contract, not ladder-gated"

[marker."SELFTEST: abi learn delivered dropped"]
phase = "policy"

[marker."SELFTEST: abi mode switch auth ok"]
phase = "policy"
proves = "authenticated (policy.abi_mode) epoch-bound switches Learn and back to Enforce applied"

[marker."SELFTEST: abi stale epoch reject FAIL"]
phase = "policy"

[marker."SELFTEST: abi enforce allow FAIL"]
phase = "policy"

[marker."SELFTEST: abi enforce deny FAIL"]
phase = "policy"

[marker."SELFTEST: abi learn collected FAIL"]
phase = "policy"

[marker."SELFTEST: abi learn records enforce=0x"]
phase = "policy"

[marker."SELFTEST: abi mode switch auth FAIL"]
phase = "policy"

[marker."SELFTEST: mmio policy deny ok"]
phase = "policy"

[marker."SELFTEST: policyd requester spoof denied ok"]
phase = "policy"

[marker."SELFTEST: policy malformed ok"]
phase = "policy"

[marker."dbg: phase policy skipped"]
phase = "policy"

[marker."SELFTEST: abi filter allow FAIL"]
phase = "policy"

[marker."SELFTEST: abi filter deny FAIL"]
phase = "policy"

[marker."SELFTEST: abi netbind deny FAIL"]
phase = "policy"

[marker."SELFTEST: bundlemgrd route execd denied FAIL"]
phase = "policy"

[marker."SELFTEST: bundlemgrd route execd denied ok"]
phase = "policy"

[marker."SELFTEST: bundlemgrd route execd denied st=0x"]
phase = "policy"

[marker."SELFTEST: keystored sign denied FAIL"]
phase = "policy"

[marker."SELFTEST: keystored sign denied ok"]
phase = "policy"

[marker."SELFTEST: logd has audit records"]
phase = "policy"

[marker."SELFTEST: logd has NO audit records"]
phase = "policy"

[marker."SELFTEST: logd record count="]
phase = "policy"

[marker."SELFTEST: logd slots "]
phase = "policy"

[marker."SELFTEST: mmio policy deny FAIL"]
phase = "policy"

[marker."SELFTEST: policy allow audit FAIL"]
phase = "policy"

[marker."SELFTEST: policy allow audit ok"]
phase = "policy"

[marker."SELFTEST: policy allow FAIL"]
phase = "policy"

[marker."SELFTEST: policy deny audit FAIL"]
phase = "policy"

[marker."SELFTEST: policy deny audit ok"]
phase = "policy"

[marker."SELFTEST: policy deny FAIL"]
phase = "policy"

[marker."SELFTEST: policyd requester spoof denied FAIL"]
phase = "policy"

[marker."SELFTEST: policy malformed FAIL"]
phase = "policy"
