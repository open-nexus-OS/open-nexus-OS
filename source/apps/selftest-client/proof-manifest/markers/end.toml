# CONTEXT: Markers in phase `end` (RFC-0014 order = 12).
# Loaded via `[include] markers = "markers/*.toml"` in
# `proof-manifest/manifest.toml`. The parser visits files in
# lexicographic order; within a file, `[marker."…"]` order is preserved
# verbatim.
#
# OWNERS: @runtime
# STATUS: Functional
# API_STABILITY: Stable; literals are the contract surface (referenced as
#                `M_<KEY>` constants from `markers_generated.rs`)

[marker."dbg: phase end skipped"]
phase = "end"

# TASK-0054C P1 (RFC-0096 Phase 1): the kernel's IPC path over the steady-state
# window as numbers (sends, heap allocations, payload copies + bytes, wake
# IPIs, handoff hit/miss) — emitted by `sched_telemetry` OP 4 next to the BKL
# budget line; prefix marker, no verdict, the values calibrate RFC-0096's budgets.
[marker."KSELFTEST: ipc stats ("]
phase = "end"

# TASK-0286 P5 (RFC-0098 C4): the memory record at the same late fence — the pool
# (banks, total, free, reserved, excluded, allocs, frees, exhausted), page-table
# frames, objects and DMA bytes, and every address space's residency (spaces,
# rss_sum, rss_max). A healthy boot shows exhausted=0; rss_sum is M3's baseline.
[marker."KSELFTEST: mm frames ("]
phase = "end"

# TASK-0333 6a (RFC-0100 §1): the objects freed because nobody named or mapped them any more —
# at a reap (what the zombie named at its exit, what its space mapped) and at the last
# `cap_close` of a VMO — and their bytes. A measurement at the same fence; the verdict is the
# exec phase's `SELFTEST: rss loop ok (`.
[marker."KSELFTEST: vm reclaim ("]
phase = "end"

# TASK-0330 S2a: the console syscalls hold the kernel lock for a copy into the ring and the
# transmit queue, never for the UART's serial time — the longest hold of either in the steady
# window against a 1 ms budget (the board's layer-0 holds were 10.5 ms and 5.0 ms).
[marker."KSELFTEST: console off lock ok ("]
phase = "end"
proves = "TASK-0330 S2a: no console syscall held the kernel lock longer than the budget in the steady-state window — the UART's own interrupt sends the bytes (RFC-0107's ring keeps them first, in order)"

# TASK-0054C P3a: the payload-size distribution over the same window. RFC-0096
# named a 64-byte inline tier before anything measured what fraction of messages
# it would cover, and an average cannot answer that — this line can.
[marker."KSELFTEST: ipc payload hist ("]
phase = "end"

[marker."SELFTEST: e2e bundlemgr ok"]
phase = "end"

[marker."SELFTEST: e2e samgr ok"]
phase = "end"

[marker."SELFTEST: signed install ok"]
phase = "end"

# TASK-0049B PR-B3b: real-service supervised-restart E2E (standing detector).
[marker."SELFTEST: service restart ok"]
phase = "end"

[marker."SELFTEST: service restart FAIL"]
phase = "end"

# TASK-0049B PR-B3c: restart-counter truth (init persists via statefs; the
# selftest asserts exactly 3 storm bumps landed) + cross-boot persistence
# (baseline > 0 only on the second keep-blk boot).
[marker."SELFTEST: crash-loop count ok"]
phase = "end"

[marker."SELFTEST: crash-loop count FAIL"]
phase = "end"

[marker."SELFTEST: crash-loop persist ok"]
phase = "end"
