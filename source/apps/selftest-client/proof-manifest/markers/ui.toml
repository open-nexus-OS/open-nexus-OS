# CONTEXT: TASK-0062 GPU-only display proof markers (Phase 6).
# OWNERS: @ui @runtime
# STATUS: In Progress (GPU-only migration)
# API_STABILITY: Stable literals once TASK-0062 Phase 6 closes
#
# Architecture: GPU-only path. Since RFC-0098 C7 (TASK-0251 P1) the display mode and the
# framebuffer are gpud's: gpud decides the mode (the lane's request from the tree, the
# device's capability, one policy), makes the framebuffer for its device and grants both to
# windowd (OP_FRAMEBUFFER_REQUEST); windowd composes into it and attaches
# (OP_SET_FRAMEBUFFER_VMO, no cap); inputd asks windowd once for the space. One owner per
# thing, one path.

# RFC-0098 C7: the display-mode chain. `scripts/qemu-test.sh` REQUIRES all four with the
# lane's mode in every display lane.
[marker."gpud: display mode "]
phase = "bringup"
proves = "gpud decided the visible mode at probe and names the candidate it took (request / device / maximum)"

[marker."gpud: framebuffer granted ("]
phase = "bringup"
proves = "gpud made the shared framebuffer for its device and granted it to windowd with the mode"

[marker."windowd: display mode from gpud ("]
phase = "bringup"
proves = "windowd built its compositor at the mode gpud granted, on the framebuffer gpud owns"

[marker."inputd: display space from windowd ("]
phase = "bringup"
proves = "inputd asked windowd once for its hit-test space (gpud's mode) over its declared reply inbox"

[marker."windowd: display none ("]
phase = "bringup"
proves = "no gpud answered (no display device, e.g. the board before its controller driver): windowd runs display-less at the layout maximum and says so"

[marker."windowd: ready (w=1280, h=800, hz=120)"]
phase = "end"
proves = "windowd initialized the fixed visible desktop profile"

# M-L: the same ready line at the layout maximum (the `visible-fhd` lane).
[marker."windowd: ready (w=1920, h=1080, hz=120)"]
phase = "bringup"
proves = "windowd resolved the full-HD visible mode, the layout maximum, and is serving"

[marker."windowd: backend=gpu"]
phase = "bringup"
proves = "windowd is the sole display owner — creates framebuffer VMO, hands off to gpud for scanout"

[marker."display: bootstrap on"]
phase = "end"
emit_when = { profile = "full" }
proves = "windowd emitted bootstrap display evidence only after the first composed frame and gpud handoff attempt"

[marker."display: mode 1280x800 argb8888"]
phase = "end"
proves = "GPU-only display path accepted exactly the fixed 1280x800 BGRA8888 virtio-gpu mode"

[marker."display: mode 1920x1080 argb8888"]
phase = "bringup"
proves = "GPU-only display path accepted the full-HD visible mode (the `visible-fhd` lane)"

[marker."windowd: compose ready"]
phase = "end"
emit_when = { profile = "full" }
proves = "windowd completed first-frame composition into gpud scanout VMO"

[marker."windowd: backend=visible"]
phase = "end"
proves = "windowd selected the visible backend for the GPU present path"

[marker."windowd: present ok (seq=1 dmg=1)"]
phase = "end"
proves = "windowd composed damaged surface state and produced a minimal present acknowledgement"

[marker."windowd: present visible ok"]
phase = "end"
proves = "windowd composed the visible frame into gpud scanout VMO"

[marker."windowd: present scheduler on"]
phase = "end"
proves = "windowd v2a present scheduler path was activated"

# TASK-0324 P6-c (RFC-0093 §5): reveal is a HANDSHAKE. windowd reports the desktop complete
# (`OP_REVEAL`); gpud reveals on the next present and acks it `STATUS_REVEALED`. The marker
# carries the seq of a frame that was actually presented — the three heuristic variants
# ("plane0 + cursor ready", "cursor slow", "TIME CAP") and the 3-pixel probe are gone.
[marker."gpud: desktop reveal (handshake seq="]
phase = "end"
proves = "gpud replaced the boot splash with the desktop on a presented frame at or after windowd's OP_REVEAL"

[marker."windowd: desktop revealed (seq="]
phase = "end"
proves = "windowd received STATUS_REVEALED for the frame it asked to reveal; every 'visible' marker prints after this, never before"

[marker."display: first scanout ok"]
phase = "end"
proves = "windowd observed successful first gpud scanout handoff for the composed visible frame"

[marker."systemui: first frame visible"]
phase = "end"
proves = "TOML-backed SystemUI desktop shell frame was the visible-present source"

[marker."SELFTEST: ui v2 present ok"]
phase = "end"
emit_when = { profile = "full" }
proves = "selftest observed the v2 present state in GPU path"

# Emitted by windowd's compositor runtime (and echoed by the selftest end
# phase) the first time a REAL input event reaches the v2 path. Not every run
# drives one — the harness injector only does so in profiles that inject — so
# this carries no `emit_when`: it is a known, meaningful line, not a claim every
# profile must produce. Registered TASK-0033 P1: it was emitted but never
# declared, and evidence assembly is deny-by-default on an unknown `SELFTEST:`
# line, so any run that DID drive input failed to assemble its bundle.
[marker."SELFTEST: ui v2 input ok"]
phase = "end"
proves = "a real input event reached windowd's v2 input path and the state was applied"

[marker."SELFTEST: ui visible present ok"]
phase = "end"
emit_when = { profile = "full" }
proves = "observer-only selftest completed service-owned visible present path in GPU-only mode"

# TASK-0324 P0 (display truth): gpud's one-shot host-GPU readback of the live
# render target after the first traced present (virgl builds). The lane's
# HOST-side pixel proof (tools/pixel_proof_judge.py) is the display verdict;
# this is the guest-side half of the same claim.
# TASK-0324 P6-d (RFC-0093 §5): display truth is read through the probe RT (`gl_probe`),
# never from the scanout. `SELFTEST: display nonblack ok` below is the gated proof; this
# names the authority that produced it.
# TASK-0324 P7-c: windowd subscribes ONCE to sessiond's state pushes (OP_WATCH, a moved SEND
# cap of its declared push channel); the session probe cadence and the login poll are gone.
[marker."windowd: session watch subscribed"]
phase = "end"
proves = "windowd registered its session push channel at sessiond — the session decision and the login arrive as pushes on a waitset member, never by polling"

# TASK-0054C P2-g: the login → shell seam, NAMED at last. A user reported "no
# handoff after the greeter" and nothing in this manifest could have caught it:
# the three markers that prove the seam were not registered anywhere, so the
# handoff could rot silently until a human tried to log in. Registering them does
# not yet REQUIRE them — an automated lane has no one to type a password, and the
# greeter's login is a Tap on a declared button, not an Enter key. Requiring them
# needs the visible injector to drive a real login against a hit rect the greeter
# DECLARES (a screenshot-derived coordinate would rot the same way). Named here
# so the next step is a step, not a rediscovery.
[marker."apphost: dsl svc session.login ok"]
phase = "end"
proves = "the greeter's login reached sessiond and was accepted — the first half of the login seam"

[marker."windowd: dsl login detected (session active)"]
phase = "end"
proves = "sessiond PUSHED the ACTIVE state to windowd after an out-of-process login — the compositor learned of the login without polling"

[marker."windowd: session shell visible"]
phase = "end"
proves = "the session shell replaced the greeter — the handoff a user reported missing (2026-09-17)"

[marker."windowd: FAIL session watch subscribe"]
phase = "end"

[marker."windowd: FAIL waitset (blocking on the server endpoint alone)"]
phase = "end"

[marker."gpud: probe sample ok"]
phase = "end"
proves = "the centre strip of the frame the display shows, read back through the probe RT (host copy off the front RT, never a scanout transfer), is non-black"

[marker."SELFTEST: display nonblack ok"]
phase = "end"
emit_when = { profile = "visible" }
proves = "gpud read back a non-black centre strip of the live GL render target after the first presented frame"

# TASK-0076B closure (2026-09-09): the DSL shell's mount evidence. app-host prints the
# canonical `.nxir` program hash after mounting (`probe/boot.rs`); the value varies per
