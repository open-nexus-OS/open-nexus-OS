# CONTEXT: Markers in phase `ipc_kernel` (RFC-0014 order = 2).
# Loaded via `[include] markers = "markers/*.toml"` in
# `proof-manifest/manifest.toml`. The parser visits files in
# lexicographic order; within a file, `[marker."…"]` order is preserved
# verbatim.
#
# OWNERS: @runtime
# STATUS: Functional
# API_STABILITY: Stable; literals are the contract surface (referenced as
#                `M_<KEY>` constants from `markers_generated.rs`)

[marker."SELFTEST: ipc payload roundtrip ok"]
phase = "ipc_kernel"

[marker."SELFTEST: nexus-ipc kernel loopback ok"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc sender pid ok"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc sender service_id ok"]
phase = "ipc_kernel"

[marker."dbg: phase ipc_kernel skipped"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc cap move reply FAIL"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc cap move reply ok"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc payload roundtrip FAIL"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc sender pid FAIL"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc sender service_id FAIL"]
phase = "ipc_kernel"

# TASK-0054C P3b (RFC-0096): the hard payload cap has its own errno. A payload
# over IPC_PAYLOAD_MAX must come back as E2BIG — before P3b it was EINVAL, which
# userspace could not tell apart from a bad pointer (the ADR-0054 failure class).
# TASK-0054C P4a: request + reply in ONE trap (syscall 58). The reply rides home
# in registers a1..a4, so a packing bug shows up as a wrong nonce here, not as a
# hang — the probe checks the echo, not just that something came back.
[marker."SELFTEST: ipc call FAIL"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc call ok"]
phase = "ipc_kernel"

# TASK-0054C P4b: reply + next request in ONE trap (syscall 59). The harness
# plays both roles against its own endpoint, so the proof needs no service change
# and stays deterministic; it also reads the answer off its reply inbox, so a
# reply that went nowhere fails instead of passing quietly.
# TASK-0054C P4c-1: the SAME exchange over `ipc_call` — one trap instead of two.
# Same server, same payload, same round count as `ipc bench` above, so the two
# `rt=` lines compare rather than merely coexist. Printed, never asserted: the
# budgets take their values from this pair before P4c-2 asserts anything.
# TASK-0054C P6 (RFC-0096 §Budgets): the round trip is ASSERTED, not just
# printed. Measured 41-43 us across every profile; the budget is 64, which CI
# jitter cannot trip and which the two-trap path it replaced (192 us) fails
# three times over.
[marker."KSELFTEST: ipc call budget FAIL (rt="]
phase = "ipc_kernel"

[marker."KSELFTEST: ipc call budget ok (rt="]
phase = "ipc_kernel"

[marker."SELFTEST: ipc call bench FAIL"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc call bench (rt="]
phase = "ipc_kernel"

[marker."SELFTEST: ipc reply_recv FAIL"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc reply_recv ok"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc oversize rejected FAIL"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc oversize rejected ok"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc soak FAIL"]
phase = "ipc_kernel"

[marker."SELFTEST: ipc soak ok"]
phase = "ipc_kernel"

# TASK-0054C P1 (RFC-0096 Phase 1): request/reply round trip as a number —
# prefix marker, `<n>us n=<N>)` follows; the harness gates the prefix, the
# value calibrates the budgets in `core/trap/budgets.rs`.
[marker."SELFTEST: ipc bench (rt="]
phase = "ipc_kernel"
proves = "64 request/reply exchanges over the ONE exchange (two traps, moved reply cap, EOF-opted wait) completed with correct PONG+nonce replies; the mean round trip is printed"

[marker."SELFTEST: ipc bench FAIL"]
phase = "ipc_kernel"

[marker."SELFTEST: nexus-ipc kernel loopback FAIL"]
phase = "ipc_kernel"
