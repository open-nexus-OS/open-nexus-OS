# CONTEXT: Markers in phase `vfs` (RFC-0014 order = 9).
# Loaded via `[include] markers = "markers/*.toml"` in
# `proof-manifest/manifest.toml`. The parser visits files in
# lexicographic order; within a file, `[marker."…"]` order is preserved
# verbatim.
#
# OWNERS: @runtime
# STATUS: Functional
# API_STABILITY: Stable; literals are the contract surface (referenced as
#                `M_<KEY>` constants from `markers_generated.rs`)

[marker."SELFTEST: ipc routing ok"]
phase = "vfs"

[marker."SELFTEST: ipc routing packagefsd ok"]
phase = "vfs"

[marker."SELFTEST: vfs stat ok"]
phase = "vfs"

[marker."SELFTEST: vfs read ok"]
phase = "vfs"

[marker."SELFTEST: pkgimg mount ok"]
phase = "vfs"

[marker."vfsd: capfd grant ok"]
phase = "vfs"

[marker."vfsd: access denied"]
