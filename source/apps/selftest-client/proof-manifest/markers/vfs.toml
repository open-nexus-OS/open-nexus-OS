[marker."SELFTEST: sandbox deny ok"]
phase = "vfs"

[marker."SELFTEST: capfd read ok"]
phase = "vfs"

[marker."SELFTEST: vfs readdir ok"]
phase = "vfs"

[marker."SELFTEST: vfs readdir deny ok"]
