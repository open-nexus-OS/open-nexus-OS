# CONTEXT: Markers in phase `ota` (RFC-0014 order = 5).
# Loaded via `[include] markers = "markers/*.toml"` in
# `proof-manifest/manifest.toml`. The parser visits files in
# lexicographic order; within a file, `[marker."…"]` order is preserved
# verbatim.
#
# OWNERS: @runtime
# STATUS: Functional
# API_STABILITY: Stable; literals are the contract surface (referenced as
#                `M_<KEY>` constants from `markers_generated.rs`)

# TASK-0198 Phase 1: device trust anchor deny lane — a validly self-signed
# archive whose publisher is NOT in policies/update-trust.toml must be
# rejected before the happy-path stage runs.
[marker."SELFTEST: updates trust reject ok"]
phase = "ota"

[marker."SELFTEST: updates trust reject FAIL"]
phase = "ota"

[marker."SELFTEST: ota stage ok"]
phase = "ota"

[marker."bundlemgrd: slot b active"]
phase = "ota"

[marker."SELFTEST: ota switch ok"]
phase = "ota"

[marker."SELFTEST: ota health ok"]
phase = "ota"

[marker."SELFTEST: ota rollback ok"]
phase = "ota"

[marker."SELFTEST: bootctl persist ok"]
phase = "ota"

# TASK-0036-A health-commit v2 (RFC-0089 §13): the commit requires the FULL
# declared quorum (updated pass-through + selftest direct report); this
# marker asserts the commit actually landed in the authority's status.
[marker."SELFTEST: bootctl quorum ok"]
phase = "ota"

# TASK-0036-B: runtime BSB projection (ADR-0058 runtime writer row).
[marker."bootctld: bsb sync (seq="]
phase = "ota"
proves = "a committed record mutation projected to the bsb partition (record FIRST, BSB second; seq bumped by the alternate-block write)"

[marker."bootctld: bsb resync"]
phase = "ota"
proves = "startup reconciliation found genuine drift (crash window between record commit and projection) and re-projected idempotently"

[marker."bootctld: bsb sync FAIL (io)"]
phase = "ota"
proves = "DIAGNOSTIC: projection write failed — the record stays authoritative, the drift heals at the next resync"

[marker."SELFTEST: bootctl bsb ok"]
phase = "ota"
proves = "GET_STATUS additive tail reports the projection synced with a runtime seq (>= 2, i.e. beyond the factory block)"

[marker."SELFTEST: bootctl bsb FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: projection not synced or seq still at factory"

[marker."SELFTEST: bootctl quorum FAIL"]
phase = "ota"

[marker."dbg: phase ota skipped"]
phase = "ota"

[marker."SELFTEST: bootctl persist FAIL"]
phase = "ota"

[marker."SELFTEST: ota health FAIL"]
phase = "ota"

[marker."SELFTEST: ota publish b FAIL"]
phase = "ota"

[marker."SELFTEST: ota publish b ok"]
phase = "ota"

[marker."SELFTEST: ota rollback FAIL"]
phase = "ota"

[marker."SELFTEST: ota stage FAIL"]
phase = "ota"

[marker."SELFTEST: ota switch FAIL"]
phase = "ota"

[marker."SELFTEST: updated recv timeout"]
phase = "ota"

[marker."SELFTEST: updated rsp len mismatch"]
phase = "ota"

[marker."SELFTEST: updated rsp magic "]
phase = "ota"

[marker."SELFTEST: updated rsp other op=0x"]
phase = "ota"

[marker."SELFTEST: updated rsp short"]
phase = "ota"

[marker."SELFTEST: updated rsp status "]
phase = "ota"

[marker."SELFTEST: updated send fail"]
phase = "ota"

[marker."SELFTEST: updated send timeout"]
phase = "ota"

[marker."SELFTEST: updated stage send"]
phase = "ota"

# Fail-closed + loud (DoD): the OTA phase names WHICH route/step failed instead
# of vanishing silently (the `bundlemgrd: slot a active` hunt, 2026-07-09).
[marker."SELFTEST: ota route FAIL svc=bundlemgrd"]
phase = "ota"

[marker."SELFTEST: ota route FAIL svc=updated"]
phase = "ota"

[marker."SELFTEST: ota slot-activate FAIL svc=bundlemgrd"]
phase = "ota"

# TASK-0315: virtioblkd partition gate — an ungranted state write must be
# DENIED (kernel-attributed sender; deny-by-default block plane).
[marker."SELFTEST: blk cross-partition deny ok"]
phase = "ota"

[marker."SELFTEST: blk cross-partition deny FAIL"]
phase = "ota"
