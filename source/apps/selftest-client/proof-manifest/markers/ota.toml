# declared quorum (updated pass-through + selftest direct report); this
# marker asserts the commit actually landed in the authority's status.
[marker."SELFTEST: bootctl quorum ok"]
phase = "ota"

# TASK-0036-B: runtime BSB projection (ADR-0058 runtime writer row).
[marker."bootctld: bsb sync (seq="]
phase = "ota"
proves = "a committed record mutation projected to the bsb partition (record FIRST, BSB second; seq bumped by the alternate-block write)"

[marker."bootctld: bsb resync"]
phase = "ota"
proves = "startup reconciliation found genuine drift (crash window between record commit and projection) and re-projected idempotently"

[marker."bootctld: bsb sync FAIL (io)"]
phase = "ota"
proves = "DIAGNOSTIC: projection write failed — the record stays authoritative, the drift heals at the next resync"

# TASK-0179 CROWN PROOF (profile `ota-flip`, two boots one uart): the
# first update that actually changes what the machine boots.
[marker."SELFTEST: ota flip staged ok"]
phase = "bringup"
emit_when = { profile = "ota-flip" }
proves = "boot 1: the REAL os-B container streamed into the inactive slot (NXBD last) and bootctld scheduled the switch — the reset that follows hands the decision to the loader"

[marker."SELFTEST: ota flip ok"]
phase = "bringup"
emit_when = { profile = "ota-flip" }
proves = "boot 2: the machine is RUNNING the newly staged slot (loader-chosen), the health quorum completed and bootctld committed it — end-to-end OTA flip"

# TASK-0321 P3 bundle-set crown proof (profile `ota-bundle`): the volume
# travels with the flip — os-B + system volume + metricsd@1.0.1 as ONE set.
[marker."SELFTEST: ota bundle-set staged ok"]
phase = "bringup"
emit_when = { profile = "ota-bundle" }
proves = "boot 1: the bundle set (boot-image + system-volume + bundle) assembled the inactive slot PAIR — index + shipped bundles + reused bundles readback-verified, NXSV last — and bootctld scheduled the switch"

[marker."SELFTEST: ota bundle-set ok"]
phase = "bringup"
emit_when = { profile = "ota-bundle" }
proves = "boot 2: running slot b, bundlemgrd verified system-b (paired with the measured image) and serves metricsd@1.0.1 — the set's bundle — and the quorum committed"

[marker."SELFTEST: ota bundle-set stage FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: boot 1 could not stage or switch the bundle set"

[marker."SELFTEST: ota bundle-set FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: the bundle-set flip did not complete (wrong slot, volume unverified, wrong bundle version, or uncommitted)"

[marker."updated-flip: wrong slot after reset (expected b)"]
phase = "ota"
proves = "DIAGNOSTIC: the reset did not land on the staged slot"

[marker."updated-flip: status unavailable after reset"]
phase = "ota"
proves = "DIAGNOSTIC: the boot-state authority was unreachable right after the flip reset"

[marker."updated-flip: rungs selftest="]
phase = "ota"
proves = "DIAGNOSTIC: which of the three flip rungs (selftest report / updated report / commit observed) failed"

# TASK-0289-B loader-backstop lanes.
[marker."SELFTEST: ota fallback staged ok"]
phase = "bringup"
emit_when = { profile = "ota-fallback" }
proves = "boot 1: the real container staged + switch armed — the trial boots that follow are honestly bricked (init fault-fixture park), so only the LOADER can recover"

[marker."SELFTEST: ota fallback ok"]
phase = "bringup"
emit_when = { profile = "ota-fallback" }
proves = "final boot: the loader exhausted the trial (2->1->0->flip) with userspace dead, bootctld observed the rollback at attach, and the measured record names slot a — the boot-time trust floor recovered the device alone"

[marker."SELFTEST: ota fallback stage FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: boot 1 could not stage or switch the real container"

[marker."SELFTEST: ota fallback FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: the fallback lane did not settle (pending trial survived, wrong slot, or the measured record disagreed)"

[marker."init: health withheld (fault fixture)"]
phase = "bringup"
emit_when = { profile = "ota-fallback" }
proves = "a TRIAL boot of the armed fault fixture parked before any service spawned — the honest brick that hands recovery to the loader"

[marker."bootctld: rollback observed (trial exhausted)"]
phase = "bringup"
emit_when = { profile = "ota-fallback" }
proves = "bootctld found the actuator's exhaustion shape on disk (next cleared, tries 0, uncommitted) against a pending record and rolled the record back instead of re-arming the broken image"

[marker."bootctld: rollback observed (persist FAIL)"]
phase = "ota"
proves = "DIAGNOSTIC: the observation could not persist — RAM is rolled back, disk heals at the next mutation"

[marker."bootctld: rollback-min adopted from factory bsb"]
phase = "ota"
proves = "record genesis took the anti-downgrade floor the factory shipped in the BSB — a fresh record starting at 0 would otherwise project over it and disarm the gate on every new device"

[marker."bootctld: rollback-min held (floor="]
phase = "ota"
proves = "DIAGNOSTIC: a commit that did not raise the anti-downgrade floor, with both numbers — distinguishes a legitimate hold from a broken raise path"

[marker."SELFTEST: ota flip stage FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: boot 1 could not stage or switch the real container"

[marker."SELFTEST: ota flip FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: the flip did not complete (wrong slot, missing quorum, or uncommitted)"

[marker."bootctld: commit ok (slot=a)"]
