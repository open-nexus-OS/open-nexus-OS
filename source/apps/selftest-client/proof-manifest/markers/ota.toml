# CONTEXT: Markers in phase `ota` (RFC-0014 order = 5).
# Loaded via `[include] markers = "markers/*.toml"` in
# `proof-manifest/manifest.toml`. The parser visits files in
# lexicographic order; within a file, `[marker."…"]` order is preserved
# verbatim.
#
# OWNERS: @runtime
# STATUS: Functional
# API_STABILITY: Stable; literals are the contract surface (referenced as
#                `M_<KEY>` constants from `markers_generated.rs`)

# TASK-0198 Phase 1: device trust anchor deny lane — a validly self-signed
# archive whose publisher is NOT in policies/update-trust.toml must be
# rejected before the happy-path stage runs.
[marker."SELFTEST: updates trust reject ok"]
phase = "ota"

[marker."SELFTEST: updates trust reject FAIL"]
phase = "ota"

[marker."SELFTEST: ota stage ok"]
phase = "ota"

[marker."bundlemgrd: slot b active"]
phase = "ota"

[marker."SELFTEST: ota switch ok"]
phase = "ota"

[marker."SELFTEST: ota health ok"]
phase = "ota"

[marker."SELFTEST: ota rollback ok"]
phase = "ota"

[marker."SELFTEST: bootctl persist ok"]
phase = "ota"

# TASK-0036-A health-commit v2 (RFC-0089 §13): the commit requires the FULL
# declared quorum (updated pass-through + selftest direct report); this
# marker asserts the commit actually landed in the authority's status.
[marker."SELFTEST: bootctl quorum ok"]
phase = "ota"

# TASK-0036-B: runtime BSB projection (ADR-0058 runtime writer row).
[marker."bootctld: bsb sync (seq="]
phase = "ota"
proves = "a committed record mutation projected to the bsb partition (record FIRST, BSB second; seq bumped by the alternate-block write)"

[marker."bootctld: bsb resync"]
phase = "ota"
proves = "startup reconciliation found genuine drift (crash window between record commit and projection) and re-projected idempotently"

[marker."bootctld: bsb sync FAIL (io)"]
phase = "ota"
proves = "DIAGNOSTIC: projection write failed — the record stays authoritative, the drift heals at the next resync"

# TASK-0179 CROWN PROOF (profile `ota-flip`, two boots one uart): the
# first update that actually changes what the machine boots.
[marker."SELFTEST: ota flip staged ok"]
phase = "bringup"
emit_when = { profile = "ota-flip" }
proves = "boot 1: the REAL os-B container streamed into the inactive slot (NXBD last) and bootctld scheduled the switch — the reset that follows hands the decision to the loader"

[marker."SELFTEST: ota flip ok"]
phase = "bringup"
emit_when = { profile = "ota-flip" }
proves = "boot 2: the machine is RUNNING the newly staged slot (loader-chosen), the health quorum completed and bootctld committed it — end-to-end OTA flip"

[marker."updated-flip: wrong slot after reset (expected b)"]
phase = "ota"
proves = "DIAGNOSTIC: the reset did not land on the staged slot"

[marker."updated-flip: status unavailable after reset"]
phase = "ota"
proves = "DIAGNOSTIC: the boot-state authority was unreachable right after the flip reset"

[marker."updated-flip: rungs selftest="]
phase = "ota"
proves = "DIAGNOSTIC: which of the three flip rungs (selftest report / updated report / commit observed) failed"

[marker."bootctld: rollback-min adopted from factory bsb"]
phase = "ota"
proves = "record genesis took the anti-downgrade floor the factory shipped in the BSB — a fresh record starting at 0 would otherwise project over it and disarm the gate on every new device"

[marker."bootctld: rollback-min held (floor="]
phase = "ota"
proves = "DIAGNOSTIC: a commit that did not raise the anti-downgrade floor, with both numbers — distinguishes a legitimate hold from a broken raise path"

[marker."SELFTEST: ota flip stage FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: boot 1 could not stage or switch the real container"

[marker."SELFTEST: ota flip FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: the flip did not complete (wrong slot, missing quorum, or uncommitted)"

[marker."bootctld: commit ok (slot=a)"]
phase = "ota"
proves = "the completed health quorum committed slot a (record persisted first)"

[marker."bootctld: commit ok (slot=b)"]
phase = "ota"
proves = "the completed health quorum committed slot b (record persisted first)"

[marker."bootctld: rollback-min raised ("]
phase = "ota"
proves = "RFC-0089 §10 commit rung: the anti-downgrade floor rose to the committed container's rollback index — it never decreases"

# TASK-0179 apply-engine v2 deny lanes (RFC-0089 §8 stable rejects).
[marker."SELFTEST: ota tamper deny ok"]
phase = "ota"
proves = "a container whose payload was bit-flipped AFTER signing is rejected `digest` at stage time — the manifest signature does not cover payload bytes, the streamed per-component digest does"

[marker."SELFTEST: ota tamper deny FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: the streamed digest gate did not reject a tampered payload"

[marker."SELFTEST: ota downgrade deny ok"]
phase = "ota"
proves = "a container whose rollbackIndex is below the persisted floor is rejected `downgrade` BEFORE any byte moves (RFC-0089 §10 stage rung)"

[marker."SELFTEST: ota downgrade deny FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: stage-time anti-downgrade did not reject a below-floor container"

[marker."updated: stage begin (source="]
phase = "ota"
proves = "path-based staging started from the named VFS source (RFC-0089 §8; the v1 inline 8-KiB stage is retired)"

[marker."updated: component boot-image verified (build="]
phase = "ota"
proves = "the boot-image component streamed, digested and readback-verified into the INACTIVE slot"

[marker."updated: stage done (slot="]
phase = "ota"
proves = "the signed NXBD landed LAST — the slot only becomes bootable after the full readback matched"

[marker."updated: stage rejected ("]
phase = "ota"
proves = "DIAGNOSTIC: an apply-engine reject with its stable RFC-0089 §8 reason"

[marker."SELFTEST: bootctl bsb ok"]
phase = "ota"
proves = "GET_STATUS additive tail reports the projection synced with a runtime seq (>= 2, i.e. beyond the factory block)"

[marker."SELFTEST: bootctl bsb FAIL"]
phase = "ota"
proves = "DIAGNOSTIC: projection not synced or seq still at factory"

[marker."SELFTEST: bootctl quorum FAIL"]
phase = "ota"

[marker."dbg: phase ota skipped"]
phase = "ota"

[marker."SELFTEST: bootctl persist FAIL"]
phase = "ota"

[marker."SELFTEST: ota health FAIL"]
phase = "ota"

[marker."SELFTEST: ota publish b FAIL"]
phase = "ota"

[marker."SELFTEST: ota publish b ok"]
phase = "ota"

[marker."SELFTEST: ota rollback FAIL"]
phase = "ota"

[marker."SELFTEST: ota stage FAIL"]
phase = "ota"

[marker."SELFTEST: ota switch FAIL"]
phase = "ota"

[marker."SELFTEST: updated recv timeout"]
phase = "ota"

[marker."SELFTEST: updated rsp len mismatch"]
phase = "ota"

[marker."SELFTEST: updated rsp magic "]
phase = "ota"

[marker."SELFTEST: updated rsp other op=0x"]
phase = "ota"

[marker."SELFTEST: updated rsp short"]
phase = "ota"

[marker."SELFTEST: updated rsp status "]
phase = "ota"

[marker."SELFTEST: updated send fail"]
phase = "ota"

[marker."SELFTEST: updated send timeout"]
phase = "ota"

[marker."SELFTEST: updated stage send"]
phase = "ota"

# Fail-closed + loud (DoD): the OTA phase names WHICH route/step failed instead
# of vanishing silently (the `bundlemgrd: slot a active` hunt, 2026-07-09).
[marker."SELFTEST: ota route FAIL svc=bundlemgrd"]
phase = "ota"

[marker."SELFTEST: ota route FAIL svc=updated"]
phase = "ota"

[marker."SELFTEST: ota slot-activate FAIL svc=bundlemgrd"]
phase = "ota"

# TASK-0315: virtioblkd partition gate — an ungranted state write must be
# DENIED (kernel-attributed sender; deny-by-default block plane).
[marker."SELFTEST: blk cross-partition deny ok"]
phase = "ota"

[marker."SELFTEST: blk cross-partition deny FAIL"]
phase = "ota"
