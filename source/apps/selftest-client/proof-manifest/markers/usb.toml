# CONTEXT: The USB host stack's vocabulary (TASK-0328 U1, RFC-0099 §7): init's USB plane (a PCI
# xHCI on QEMU; the board's tree node from U3 on) and the host controller service's lines — the
# controller running, the root ports scanned, a hub and its ports, every device enumerated, every
# HID boot interface reporting — and, since TASK-0253B, the HID boot class (RFC-0099 §5): xhcid
# serving it, hidrawd subscribed and admitted, its USB source naming every device. Only the `usb`
# lanes attach a controller; every other lane says `usb plane none`, and the subscription is made
# and admitted there too. The REQUIRED ladder lives in `scripts/qemu-test.sh` (`USB_MARKERS`,
# `USB_INPUT_MARKERS`); a `xhcid: FAIL (…)` line fails any lane through its FAIL gate.
# OWNERS: @runtime @drivers
# STATUS: Functional
# API_STABILITY: Stable (marker literals are contracts)

[marker."init: usb host from pci ("]
phase = "bringup"
proves = "TASK-0328 U1: init found the xHCI host controller (class 0c03, interface 30) behind the tree's ECAM host and placed it; xhcid is granted its window and bus mastering follows the grant"
emit_when = { profile = ["usb", "usb-visible"] }

[marker."init: usb plane none ("]
phase = "bringup"
proves = "TASK-0328 U1: the machine has no USB host controller init grants (QEMU without qemu-xhci; the board until U3 brings its node up through socd)"
forbidden_when = { profile = ["usb", "usb-visible"] }

[marker."xhcid: no host controller (usb plane none)"]
phase = "bringup"
proves = "TASK-0328 U1: xhcid holds no controller window and parks on its waitset (no polling, no FAIL)"
forbidden_when = { profile = ["usb", "usb-visible"] }

[marker."xhcid: controller ok ("]
phase = "bringup"
proves = "RFC-0099 §4: the controller was reset, set up (DCBAA, command ring, event ring, interrupter) and runs (HCH clear) with its line bound"
emit_when = { profile = ["usb", "usb-visible"] }

[marker."xhcid: ready ("]
phase = "bringup"
proves = "RFC-0099 §4: every root port powered and scanned; enumeration begins"
emit_when = { profile = ["usb", "usb-visible"] }

[marker."xhcid: hub ("]
phase = "bringup"
proves = "RFC-0099 §4: a hub is configured (its slot carries hub fields), its ports powered past their power-good time, its status-change pipe running"
emit_when = { profile = ["usb", "usb-visible"] }

[marker."xhcid: device enumerated ("]
phase = "bringup"
proves = "RFC-0099 §4: a device got a slot and an address and its device and configuration descriptors passed nexus-usb's bounds"
emit_when = { profile = ["usb", "usb-visible"] }

[marker."xhcid: hid boot interface ("]
phase = "bringup"
proves = "RFC-0099 §4: a HID boot interface is in the boot protocol and its interrupt pipe has its TRBs queued"
emit_when = { profile = ["usb", "usb-visible"] }

# --- TASK-0253B: the HID boot class (RFC-0099 §5) -------------------------------------------------

[marker."xhcid: serving (class=hid-boot)"]
phase = "bringup"
proves = "TASK-0253B: xhcid's server endpoint is a member of its waitset and xhcid announced @ready — a server of the DisplayReady stage, on every lane, with or without a controller"

[marker."xhcid: hid class subscribed (interfaces="]
phase = "bringup"
proves = "RFC-0099 §5: a SUBSCRIBE arrived with its push channel and policyd granted the kernel-attributed sender `usb.hid` — the class's one subscriber, told every interface attached so far"

[marker."xhcid: hid class subscriber refused ("]
phase = "bringup"
proves = "RFC-0099 §5: a SUBSCRIBE was refused (malformed, an unknown class, or the sender lacks `usb.hid`) — answered on its own channel, the subscription untouched"
forbidden_when = { profile = ["usb", "usb-visible"] }

[marker."xhcid: hid interface lost ("]
phase = "bringup"
proves = "RFC-0099 §5: a HID interface's pipe was given up after repeated errors; its client was told the interface is gone"
forbidden_when = { profile = ["usb", "usb-visible"] }

[marker."hidrawd: usb hid subscribed"]
phase = "bringup"
proves = "TASK-0253B: hidrawd's SUBSCRIBE (its push channel's SEND half moved to xhcid) was answered OK on that channel — the USB source is xhcid's admitted class client"

[marker."hidrawd: usb hid device ("]
phase = "bringup"
proves = "TASK-0253B: xhcid attached a HID boot interface and hidrawd registered its parser (keyboard or mouse) under a device name of its own"
emit_when = { profile = ["usb", "usb-visible"] }

[marker."hidrawd: usb hid report seen"]
phase = "bringup"
proves = "TASK-0253B: a boot report from a USB device reached hidrawd through xhcid's push channel and its parser"
emit_when = { profile = ["usb", "usb-visible"] }

[marker."hidrawd: usb hid frame rejected ("]
phase = "bringup"
proves = "TASK-0253B: a frame on the push channel was refused whole (not xhcid's, malformed, an unknown device, a role or table bound)"
forbidden_when = { profile = ["usb", "usb-visible"] }
