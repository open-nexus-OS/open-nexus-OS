[package]
name = "nexus-service-entry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
alloc-log = ["nexus-log"]
heap-512k = []
heap-768k = []
heap-1m = []
heap-2m = []
heap-4m = []
heap-8m = []
heap-16m = []
# ADR-0065: the frame arena is OPT-IN. Without it the region is zero-sized, so a
# service's .bss and image are unchanged to the byte and the scope API is inert.
frame-arena = []
# ADR-0065 tripwire: fill a reset generation with 0xDE so a stale reader fails
# loudly. One memset of the USED bytes per frame; app-host keeps it on.
frame-arena-poison = []
# ADR-0065 / TASK-0077C P3: size-class free lists for durable state, so a
# service that overwrites store values for a whole session has a bounded heap.
small-object-free-list = []

[dependencies]
nexus-abi = { path = "../nexus-abi" }
# TASK-0324 P4f-6: the control channel `@ready` travels on has one home.
nexus-service-topology = { path = "../nexus-service-topology" }
nexus-log = { path = "../nexus-log", optional = true, features = ["sink-userspace"] }
nexus-sync = { path = "../nexus-sync" }
