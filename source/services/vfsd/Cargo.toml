[package]
name = "vfsd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vfsd"
path = "src/main.rs"

[features]
default = ["std", "idl-capnp"]
std = [
    "dep:capnp",
    "dep:log",
    "dep:parking_lot",
    "dep:thiserror",
    "dep:nexus-idl-runtime",
    "dep:nexus-packagefs",
    "dep:nexus-ipc",
    "nexus-ipc/std",
]
idl-capnp = ["nexus-idl-runtime/capnp", "dep:capnp"]
os-lite = [
    "dep:nexus-service-entry",
    # TASK-0068: every home write leaves small blocks behind (path strings,
    # extent lists, journal records, the status reply); on a bump heap that
    # never frees they add up per write. Freed blocks of <= 2 KiB go back to
    # their size class instead (ADR-0065). Large buffers are owned once.
    "nexus-service-entry/small-object-free-list",
    "dep:nexus-ipc",
    "nexus-ipc/os-lite",
    "nexus-ipc/kernel-ipc",
    "dep:nexus-abi",
    "dep:nxfsd",
    "nxfsd/os-lite",
]

[package.metadata.nexus-service]
stack_pages = 0

[dependencies]
capnp = { version = "0.24", optional = true }
log = { version = "0.4", optional = true }
parking_lot = { version = "0.12", optional = true }
thiserror = { version = "2", optional = true }
nexus-idl-runtime = { path = "../../../userspace/nexus-idl-runtime", optional = true }
nexus-ipc = { path = "../../../userspace/nexus-ipc", optional = true, default-features = false }
# TASK-0324 P4f-1a: capability slots have one home.
nexus-service-topology = { path = "../../libs/nexus-service-topology" }
nexus-vfs-types = { path = "../../../userspace/vfs-types" }
nexus-packagefs = { path = "../../../userspace/nexus-packagefs", optional = true }
nexus-service-entry = { path = "../../libs/nexus-service-entry", optional = true }
nexus-abi = { path = "../../libs/nexus-abi", optional = true }
nxfsd = { path = "../nxfsd", optional = true, default-features = false }
sha2 = { version = "0.10", default-features = false }
