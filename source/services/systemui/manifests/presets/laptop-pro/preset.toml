#
# CONTEXT: Dev-mode display/profile preset `laptop-pro` (TASK-0055D). A preset is a
# named bundle that resolves INTO the existing authorities — a registered
# SystemUI profile + shell (manifests/profiles, manifests/shells) and the
# fw_cfg display mode (RFC-0074 / ADR-0050) — never a second profile store.
# Consumed by `nx ui preset env` → `just start-preset laptop-pro`.
# OWNERS: @ui
# STATUS: Experimental

id = "laptop-pro"
label = "Laptop Pro (HiDPI)"
profile = "desktop"
shell = "desktop"

[display]
width = 1280
height = 800
# Refresh rate the compositor paces at. Only the rates windowd can actually
# pace are accepted (see systemui::SUPPORTED_DISPLAY_HZ).
hz = 120
orientation = "landscape"
dpi_class = "high"

[input]
# Emulated QEMU input sources for this preset (touch → tablet device,
# mouse → relative pointer, kbd → keyboard).
touch = true
mouse = true
kbd = true
remote = false
rotary = false
