# CONTEXT: SystemUI tablet shell — touch-first posture, single canonical root.
# OWNERS: @ui
# STATUS: Experimental

id = "tablet"
kind = "tablet"
dsl_root = "ui/shells/tablet"
supported_profiles = ["tablet"]

[first_frame]
# The layout maximum (`nexus_display_proto::layout::LAYOUT_MAX`, 1920x1080 = the board's HDMI
# mode): the first frame and the baked wallpaper are composed at the maximum and cropped to
# the visible mode by windowd (M-L, 2026-09-30).
width = 1920
height = 1080

[features]
launcher = true
multiwindow = false
quick_settings = true
settings_entry = true
