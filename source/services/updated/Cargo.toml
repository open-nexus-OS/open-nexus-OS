[package]
name = "updated"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["std", "idl-capnp"]
std = [
    "dep:updates",
    "updates/std",
    "dep:nexus-idl-runtime",
    "dep:capnp",
    "dep:nexus-ipc",
    "nexus-ipc/std",
    "dep:thiserror",
    "dep:ed25519-dalek",
    "dep:statefs",
    "statefs/std",
]
idl-capnp = ["nexus-idl-runtime/capnp", "dep:capnp"]
os-lite = [
    "dep:updates",
    "updates/os-lite",
    "dep:bootctld",
    "bootctld/os-lite",
    "dep:nexus-service-entry",
    "dep:nexus-abi",
    "dep:nexus-ipc",
    "nexus-ipc/os-lite",
    "nexus-ipc/kernel-ipc",
    "dep:nexus-log",
    "dep:ed25519-dalek",
    "dep:statefs",
    "statefs/ipc-client",
    "statefs/os-lite",
    "dep:storage",
    "storage/os-lite",
    "dep:nexus-vfs-types",
    "dep:sha2",
]

[lib]
path = "src/lib.rs"

[package.metadata.nexus-service]
stack_pages = 0

[dependencies]
updates = { path = "../../../userspace/updates", optional = true, default-features = false }
nexus-idl-runtime = { path = "../../../userspace/nexus-idl-runtime", optional = true }
capnp = { version = "0.24", optional = true }
nexus-ipc = { path = "../../../userspace/nexus-ipc", optional = true, default-features = false }
thiserror = { version = "2", optional = true }
nexus-service-entry = { path = "../../libs/nexus-service-entry", optional = true }
nexus-abi = { path = "../../libs/nexus-abi", optional = true }
nexus-log = { path = "../../libs/nexus-log", default-features = false, features = ["sink-logd"], optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"], optional = true }
statefs = { path = "../../../userspace/statefs", optional = true, default-features = false }
# TASK-0050 PR-2 (ADR-0055): the boot-state authority's wire constants —
# updated delegates every slot mutation to bootctld.
bootctld = { path = "../bootctld", optional = true, default-features = false }
# TASK-0140: wire SSOT for the cfg-free `updates.manage` gate (host tests
# prove the exact op classification the OS loop executes).
nexus-wire = { path = "../../libs/nexus-wire" }
# TASK-0179: partition-scoped slot writes + the vfsd splice data plane.
storage = { path = "../../../userspace/storage", optional = true, default-features = false }
nexus-vfs-types = { path = "../../../userspace/vfs-types", optional = true, default-features = false }
sha2 = { version = "0.10", optional = true, default-features = false }

[[bin]]
name = "updated"
path = "src/main.rs"
