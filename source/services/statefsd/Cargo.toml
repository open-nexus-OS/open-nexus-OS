[package]
name = "statefsd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["std"]
# `dep:storage` under std: the cfg-free txn/compaction core (src/txn.rs) is
# generic over `storage::BlockDevice` so the host contract tests exercise the
# exact code the OS serve loop runs.
std = ["dep:statefs", "statefs/std", "dep:storage"]
os-lite = [
    "dep:nexus-service-entry",
    "dep:nexus-abi",
    "dep:nexus-ipc",
    "nexus-ipc/os-lite",
    "nexus-ipc/kernel-ipc",
    "dep:statefs",
    "statefs/os-lite",
    "dep:storage",
    "storage/os-lite",
    "dep:nexus-metrics",
    "nexus-metrics/os-lite",
]

[package.metadata.nexus-service]
stack_pages = 0

[dependencies]
statefs = { path = "../../../userspace/statefs", optional = true, default-features = false }
# TASK-0025 hardening: deterministic device-key signature as the HKDF ikm
# (see src/hardening.rs). Same no_std configuration keystored ships.
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# TASK-0049C: 1MiB heap — the 384KiB default starved on preserved-image
# boots (journal replay + ~40 compaction generations + evidence-spill txn
# churn on the never-freeing bump; alloc-fail killed the store mid-proof).
# Honest fix for the per-request Vec churn is buffer reuse (follow-up in
# the 0049C ledger); the watermark markers keep the ceiling visible.
nexus-service-entry = { path = "../../libs/nexus-service-entry", optional = true, features = ["heap-1m"] }
nexus-abi = { path = "../../libs/nexus-abi", optional = true }
nexus-ipc = { path = "../../../userspace/nexus-ipc", optional = true, default-features = false }
storage = { path = "../../../userspace/storage", optional = true, default-features = false }
nexus-metrics = { path = "../../../userspace/nexus-metrics", optional = true, default-features = false }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
# hardening_contract.rs replays a journal on a MemBlockDevice.
storage = { path = "../../../userspace/storage" }

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "statefsd"
path = "src/main.rs"
