[package]
name = "touchd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "touchd"
path = "src/lib.rs"

[features]
default = []
os-lite = ["dep:nexus-abi", "dep:nexus-service-entry"]

[package.metadata.nexus-service]
# 8 pages: the manifest's old value (1) was never in effect for a volume
# service — scripts/build.sh gave every bundle 8 before TASK-0324 P0 made the
# manifest the only source. Keep the proven size.
stack_pages = 8

[dependencies]
touch = { path = "../../../userspace/touch" }
nexus-abi = { path = "../../libs/nexus-abi", optional = true }
nexus-service-entry = { path = "../../libs/nexus-service-entry", optional = true }
