[package]
name = "blkd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = ["std"]
std = []
os-lite = []

[package.metadata.nexus-service]
stack_pages = 0

[dependencies]
# TASK-0246 P4b: the backend is chosen from the loader's boot-disk record in the tree, the
# window checked against the recorded node or ECAM host, the SD host configured from its node.
nexus-fdt = { path = "../../libs/nexus-fdt" }
nexus-pci = { path = "../../libs/nexus-pci" }
storage-sdhci = { path = "../../drivers/storage/sdhci" }

[target.'cfg(not(target_os = "none"))'.dependencies]
# The host proves the pure parts (`backend`, `gate`) against the same protocol constants and ids.
nexus-abi = { path = "../../libs/nexus-abi" }
storage = { path = "../../../userspace/storage" }

[target.'cfg(all(target_os = "none", target_arch = "riscv64"))'.dependencies]
nexus-service-entry = { path = "../../libs/nexus-service-entry" }
nexus-abi = { path = "../../libs/nexus-abi" }
nexus-service-topology = { path = "../../libs/nexus-service-topology" }
nexus-ipc = { path = "../../../userspace/nexus-ipc", default-features = false, features = ["os-lite", "kernel-ipc"] }
storage = { path = "../../../userspace/storage", default-features = false, features = ["os-lite"] }
