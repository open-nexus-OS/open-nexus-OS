[package]
name = "netstackd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = ["std"]
std = []
os-lite = []
# QEMU smoke harness compatibility:
# - Prefer the slirp/usernet-compatible fallback IP (10.0.2.15) when DHCP is unavailable
# - This keeps loopback-based DSoftBus bring-up deterministic in single-VM smoke runs
# - 2-VM os2vm profile keeps deterministic MAC-derived fallback in 10.42.0.0/24
qemu-smoke = []

[package.metadata.nexus-service]
stack_pages = 0
features = ["os-lite"]

# Build-truth SSOT (TASK-0324 P0): proof boots (QEMU_SESSION_MODE=proof, the
# harness default) add `qemu-smoke` — the slirp fallback IP that keeps the
# single-VM ladders deterministic. Interactive boots (`just start`) do not.
# This used to be a harness-side *_CARGO_FLAGS override that the system-volume
# bundle build silently ignored.
[package.metadata.nexus-service.feature_profiles]
qemu_session_mode = { proof = ["qemu-smoke"] }

[dependencies]

[target.'cfg(not(target_os = "none"))'.dependencies]
# Host stub for now (this service is OS-first).

[target.'cfg(all(target_os = "none", target_arch = "riscv64"))'.dependencies]
nexus-service-entry = { path = "../../libs/nexus-service-entry" }
nexus-abi = { path = "../../libs/nexus-abi" }
nexus-ipc = { path = "../../../userspace/nexus-ipc", default-features = false, features = ["os-lite", "kernel-ipc"] }
nexus-net = { path = "../../../userspace/nexus-net" }
nexus-net-os = { path = "../../../userspace/nexus-net-os", default-features = false, features = ["os-lite"] }
