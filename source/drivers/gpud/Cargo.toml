[package]
name = "gpud"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "gpud"
path = "src/lib.rs"

[features]
default = []
os-lite = [
    "dep:nexus-abi",
    "dep:nexus-ipc",
    "dep:nexus-service-entry",
    "dep:nexus-driverkit",
]
# Enables GPU-accelerated backdrop blur via virgl (QEMU -device virtio-gpu-pci,virgl=on).
# When enabled and virgl is detected at runtime, gpud emits "gpud: virgl ready".
# Without this feature or when virgl is not detected, CPU fallback is used.
virgl = []

[package.metadata.nexus-service]
kind = "service"
# 8 pages (32 KiB): the virgl attach/warmup path overflowed the 2 pages this
# used to declare — a value scripts/build.sh never honoured before TASK-0324 P0
# (every service silently got 8). Now the manifest is the only source.
stack_pages = 8
# Build-truth SSOT (TASK-0324 P0): the cargo features EVERY build path uses
# for this service — the embedded init-lite table and the system-volume bundle
# alike (`scripts/discover-services.sh --cargo-features gpud`). A missing
# `features` means `["os-lite"]`. `feature_profiles` adds features when the
# named environment variable carries the named value: `GPU_MODE=virgl` adds
# `virgl`, because a GL device (`virtio-gpu-gl`) needs a GL-capable driver —
# the 2D plane-row scanout is black on every GL display backend.
features = ["os-lite"]

[package.metadata.nexus-service.feature_profiles]
gpu_mode = { virgl = ["virgl"] }

[dependencies]
libm = "0.2"
nexus-gfx = { path = "../../../userspace/nexus-gfx" }
# Gate 2: the windowd↔gpud wire SSOT (opcodes/status/cursor magics + control
# frame codecs), shared with windowd so neither end hand-mirrors the other.
nexus-display-proto = { path = "../../libs/nexus-display-proto" }
# RFC-0067 P5: the CPU vector fallback rasterizes via the one SDF math SSOT
# (nexus-sdf fixed-point AA), matching the GPU shaders + the compositor.
nexus-sdf = { path = "../../../userspace/ui/sdf" }
nexus-abi = { path = "../../libs/nexus-abi", optional = true }
nexus-ipc = { path = "../../../userspace/nexus-ipc", default-features = false, features = ["os-lite", "kernel-ipc"], optional = true }
nexus-service-entry = { path = "../../libs/nexus-service-entry", optional = true }
nexus-driverkit = { path = "../../libs/nexus-driverkit", optional = true }

# Build-time only: rasterize the boot-splash logo SVG → embedded BGRA bitmap (host std).
[build-dependencies]
nexus-svg = { path = "../../../userspace/ui/svg" }
