[package]
name = "virtio-input"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "virtio_input"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
os-lite = ["dep:nexus-abi", "dep:nexus-driverkit"]

[dependencies]
nexus-hal = { path = "../../../libs/nexus-hal" }
nexus-abi = { path = "../../../libs/nexus-abi", optional = true }
# TASK-0251 P2 (the MMIO seam): the transport's registers through the shared `Mmio` bus.
nexus-driverkit = { path = "../../../libs/nexus-driverkit", optional = true }
