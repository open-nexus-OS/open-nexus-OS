[package]
name = "storage-virtio-blk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
os-lite = []

[dependencies]
nexus-hal = { path = "../../../libs/nexus-hal" }
nexus-abi = { path = "../../../libs/nexus-abi" }
# TASK-0251 P2 (the MMIO seam): the transport's registers through the shared `Mmio` bus.
nexus-driverkit = { path = "../../../libs/nexus-driverkit" }
# TASK-0054C P2-b: the completion wait's bound is a kernel timer on the declared
# device-watchdog pair (`nexus_ipc::timer`), never a receive deadline.
nexus-ipc = { path = "../../../../userspace/nexus-ipc", default-features = false, features = ["os-lite", "kernel-ipc"] }
nexus-service-topology = { path = "../../../libs/nexus-service-topology" }
# The `nexus_env` cfg is declared here so a HOST compile without the
# workspace RUSTFLAGS (e.g. as a build-dependency of an OS service) stays
# warning-free under the hard warning gate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nexus_env, values("host", "os"))'] }
